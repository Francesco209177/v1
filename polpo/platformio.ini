; Polpo — firmware multi-tool per M5Stack Cardputer (v1.1 e Adv).
; Compilare:        pio run -e cardputer
; Test su PC:       pio test -e native
; Caricare via USB: pio run -e cardputer -t upload

[platformio]
default_envs = cardputer

[env:cardputer]
platform = espressif32@8.0.0
board = m5stack-cardputer
framework = arduino
; Il Cardputer ha 8 MB di flash (la definizione della scheda ne dichiara 4).
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
; USB in modalità OTG (TinyUSB): serve per la tastiera USB (BadUSB) + porta seriale.
board_build.extra_flags =
    -DARDUINO_M5STACK_CARDPUTER
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=0
    -DPOLPO_FIRMWARE=1
    ; alcune librerie del core (USB, WiFi) includono FS.h e Network.h senza dichiararli
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
build_unflags = -std=gnu++11
lib_deps =
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0
    m5stack/M5Cardputer@1.1.1
    h2zero/NimBLE-Arduino@2.5.2
    sui77/rc-switch@2.6.4
    kkloesener/MFRC522_I2C@1.0
    bblanchon/ArduinoJson@7.4.3
lib_ignore = IRremote
lib_ldf_mode = deep+
; File di esempio copiati sulla microSD al primo avvio.
board_build.embed_txtfiles =
    sd_template/polpo/LEGGIMI.txt
    sd_template/polpo/badusb/ciao_windows.txt
    sd_template/polpo/badusb/ciao_mac.txt
    sd_template/polpo/badusb/ciao_linux.txt
    sd_template/polpo/ir/esempio_tv.ir
extra_scripts =
    pre:scripts/version.py
    post:scripts/merge_bin.py
monitor_speed = 115200

; Test della logica pura (cartella lib/polpo_core) sul computer, con sanitizer.
[env:native]
platform = native
test_framework = unity
lib_deps = bblanchon/ArduinoJson@7.4.3
test_build_src = no
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
extra_scripts = pre:scripts/native_sanitize.py
