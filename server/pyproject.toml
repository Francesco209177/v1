[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iphone-backup"
version = "1.0.0"
description = "Backup completo dell'iPhone (stile Finder/iTunes) gestito da un server Debian con interfaccia web"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
iphone-backup = "iphone_backup.__main__:main"

[tool.setuptools.packages.find]
include = ["iphone_backup", "iphone_backup.*"]
namespaces = true

[tool.setuptools.package-data]
"iphone_backup.templates" = ["*.html"]
"iphone_backup.static" = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
