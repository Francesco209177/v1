<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Il Codice dei Dipinti</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Caveat:wght@500;600&family=Instrument+Serif:ital@0;1&family=VT323&display=swap">
<style>
/* Layout: segnaletica nera in alto, poi una "parete" alla volta (manifesto, pianta, sala); l'audioguida è un apparecchio fisso in basso a destra. */
:root{
  --wall:#E7E7E2; --wall-2:#D9DAD3; --panel:#F5F5F1; --ink:#151515; --muted:#5A5B56; --line:#C2C3BB;
  --klein:#1B3DBD; --on-klein:#FFFFFF; --red:#CC2E1E; --blue:#1F45C4; --yellow:#E9AE06; --gold:#B08422; --silver:#9EA3A8;
  --tile-b:#1A1A1A; --tile-w:#F8F7F2; --sign:#121212; --on-sign:#F1F1EC; --device:#26272A; --device-2:#3B3C41;
  --lcd:#B5C498; --lcd-ink:#1F2918; --ok:#1C7A44; --bad:#BF2617; --memo:#F3DF74; --memo-ink:#2A2614; --sel:#D6DDF6; --door:#3A352E; --door-2:#544D43; --light-in:#FFE7A0; --cork:#B4875A; --exit:#0E8A4A;
  --display:"Archivo","Arial Narrow",Helvetica,Arial,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --lcd-f:"VT323",ui-monospace,Menlo,Consolas,monospace;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#141518; --wall-2:#1D1F23; --panel:#22242A; --ink:#ECECE6; --muted:#9D9F98; --line:#383B42;
    --klein:#7C95FF; --on-klein:#0D1020; --red:#F05A43; --blue:#5D7FFF; --yellow:#FFC83A; --gold:#D8AC48; --silver:#B9BEC4;
    --tile-b:#0A0A0A; --tile-w:#E9E8E1; --sign:#050505; --on-sign:#F1F1EC; --device:#0E0F11; --device-2:#2B2D32;
    --lcd:#9DB37A; --lcd-ink:#172010; --ok:#4FC07E; --bad:#FF6B5B; --memo:#D8C45B; --memo-ink:#221F10; --sel:#28304F; --door:#2A2B30; --door-2:#40424A; --light-in:#F2CF6A; --cork:#6E5235; --exit:#1FA35E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall:#141518; --wall-2:#1D1F23; --panel:#22242A; --ink:#ECECE6; --muted:#9D9F98; --line:#383B42;
  --klein:#7C95FF; --on-klein:#0D1020; --red:#F05A43; --blue:#5D7FFF; --yellow:#FFC83A; --gold:#D8AC48; --silver:#B9BEC4;
  --tile-b:#0A0A0A; --tile-w:#E9E8E1; --sign:#050505; --on-sign:#F1F1EC; --device:#0E0F11; --device-2:#2B2D32;
  --lcd:#9DB37A; --lcd-ink:#172010; --ok:#4FC07E; --bad:#FF6B5B; --memo:#D8C45B; --memo-ink:#221F10; --sel:#28304F; --door:#2A2B30; --door-2:#40424A; --light-in:#F2CF6A; --cork:#6E5235; --exit:#1FA35E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--klein);outline-offset:2px}
p{margin:0}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.serif{font-family:var(--serif)}
.cap{font-size:.74rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* segnaletica */
.sign{background:var(--sign);color:var(--on-sign)}
.sign .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:12px}
.sign-brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;min-width:0}
.sign-name{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase}
.sign-where{font-size:.82rem;opacity:.75}
.sign-tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tog{background:transparent;border:1px solid rgba(241,241,236,.35);color:var(--on-sign);font-size:.76rem;padding:4px 10px;border-radius:999px}
.tog:hover{border-color:var(--on-sign)}
.clock{display:flex;align-items:center;gap:8px}
.clock svg{width:38px;height:38px}
.clock .face{fill:var(--on-sign)}
.clock .tick{stroke:var(--sign);stroke-width:1.4}
.clock .hh,.clock .mh{stroke:var(--sign);stroke-linecap:round;transform-origin:20px 20px;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.clock .hh{stroke-width:2.6}.clock .mh{stroke-width:1.8}
.clock.late .mh{stroke:var(--bad)}
.clock-t{font-family:var(--lcd-f);font-size:1.6rem;line-height:1;letter-spacing:.04em}
.clock-l{display:block;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.clock.jump svg{animation:jump .6s}
@keyframes jump{30%{transform:scale(1.25) rotate(-8deg)}60%{transform:scale(.95)}}
.float{position:fixed;z-index:80;pointer-events:none;font:700 1rem var(--body);color:var(--bad);background:var(--panel);padding:2px 8px;border-radius:999px;transform:translate(-50%,0);animation:floatup 1.4s ease-out forwards}
@keyframes floatup{from{opacity:0;transform:translate(-50%,8px)}15%{opacity:1}to{opacity:0;transform:translate(-50%,46px)}}

main{padding-block:28px 64px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--wall);border:0;border-radius:2px;padding:13px 22px;font-weight:700;font-stretch:112%;letter-spacing:.02em;transition:background .2s,transform .15s}
.btn:hover{background:var(--klein);color:var(--on-klein)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;background:var(--ink)}
.btn .arr{transition:transform .2s}.btn:hover .arr{transform:translateX(4px)}
.lnk{background:none;border:0;padding:6px 0;font-weight:600;border-bottom:2px solid currentColor}
.lnk:hover{color:var(--klein)}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:500}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--wall);border-color:var(--ink)}

/* manifesto d'ingresso */
.poster{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:0;background:var(--panel);border:1px solid var(--line)}
.p-art{display:grid;grid-template-columns:2fr 1fr 1.4fr;grid-template-rows:1.3fr 1fr 1.6fr;gap:10px;background:var(--ink);padding:10px;min-height:340px}
.p-art i{display:block;background:var(--tile-w)}
.p-art i:nth-child(1){background:var(--red);grid-row:span 2}
.p-art i:nth-child(3){background:var(--yellow)}
.p-art i:nth-child(5){background:var(--blue);grid-column:span 2}
.p-art i:nth-child(6){background:var(--yellow)}
.p-art i:nth-child(7){background:var(--blue)}
.p-art i{animation:blockIn .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*90ms)}
@keyframes blockIn{from{transform:scale(.2);opacity:0}}
.p-type{padding:clamp(20px,4vw,48px);display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-width:0}
.p-kicker{font-size:.8rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--klein)}
.p-title{font-stretch:125%;font-weight:900;font-size:clamp(2.6rem,7.5vw,6rem);line-height:.9;letter-spacing:-.02em;text-transform:uppercase;display:flex;flex-direction:column}
.p-title span{display:block;overflow:hidden}
.p-title span b{display:inline-block;font-weight:inherit;animation:lineUp .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.25s + var(--k)*.12s)}
@keyframes lineUp{from{transform:translateY(105%)}}
.p-dates{font-family:var(--serif);font-size:1.4rem;font-style:italic}
.intro-cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;margin-top:40px}
.story{display:flex;flex-direction:column;gap:14px;max-width:62ch;font-size:1.05rem}
.memo{position:relative;background:var(--memo);color:var(--memo-ink);font-family:var(--hand);font-size:1.45rem;line-height:1.25;padding:16px 20px 18px;transform:rotate(-1.2deg);box-shadow:0 10px 20px -12px rgba(0,0,0,.45);max-width:52ch}
.memo::before{content:"";position:absolute;left:50%;top:-10px;width:86px;height:22px;margin-left:-43px;background:var(--wall-2);opacity:.85;transform:rotate(2deg)}
.memo small{display:block;font-family:var(--body);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;opacity:.75}
.howto{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:h}
.howto li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:h}
.howto li::before{content:counter(h);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--wall);font-weight:700;font-size:.8rem}
.ticket{display:flex;flex-direction:column;gap:14px;padding:20px;background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--klein)}
.ticket label{font-size:.74rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ticket input{font:500 1.1rem var(--body);padding:11px 12px;border:1px solid var(--line);background:var(--wall);color:var(--ink);border-radius:2px;min-width:0}
.side-stack{display:flex;flex-direction:column;gap:22px}

/* libro delle firme */
.guestbook{background:var(--panel);border:1px solid var(--line);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.gb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.gb-list li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.gb-list li.me{background:var(--sel);padding-inline:6px;margin-inline:-6px}
.gb-n{font-family:var(--serif);font-style:italic;color:var(--muted)}
.gb-name{font-family:var(--hand);font-size:1.5rem;line-height:1.1;overflow-wrap:anywhere}
.gb-meta{font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.gb-meta b{display:block;font-family:var(--lcd-f);font-size:1.3rem;color:var(--ink);font-weight:400}

/* pianta */
.plan-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}
.plan-head h1{font-stretch:125%;font-weight:900;font-size:clamp(1.8rem,4.5vw,3rem);line-height:1;text-transform:uppercase}
.plan-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:32px;align-items:start}
.plan-stage{position:relative;will-change:transform}
.plan svg{display:block;width:100%;height:auto}
.plan .wallp{fill:none;stroke:var(--ink);stroke-width:6;stroke-linejoin:round}
.plan .rm{cursor:pointer}
.plan .rm rect{fill:var(--panel);stroke:var(--ink);stroke-width:3;transition:fill .25s}
.plan .rm:hover rect,.plan .rm:focus-visible rect{fill:var(--sel)}
.plan .rm:focus-visible{outline:none}
.plan .rm.done rect{fill:var(--sel)}
.plan .rm .num{font:900 34px var(--display);font-stretch:125%;fill:var(--ink)}
.plan .rm .nm{font:500 12px var(--body);fill:var(--muted)}
.plan .rm .st{font:600 10px var(--body);letter-spacing:1.2px;fill:var(--klein)}
.plan .rm .badge{fill:var(--klein)}
.plan .rm .badge-t{fill:var(--on-klein);font:700 13px var(--body)}
.plan .corr{fill:var(--wall-2)}
.plan .corr-t{font:600 11px var(--body);letter-spacing:2px;fill:var(--muted)}
.plan .door{cursor:pointer}
.plan .door rect{fill:var(--bad);transition:fill .2s}
.plan .door:hover rect{fill:var(--klein)}
.plan .door text{font:700 10px var(--body);letter-spacing:1px;fill:var(--wall)}
.plan .you{fill:var(--klein)}
.plan .you-ring{fill:none;stroke:var(--klein);stroke-width:2;transform-origin:center;transform-box:fill-box;animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(2.4);opacity:0}}
.notes{display:flex;flex-direction:column;gap:12px}
.notes h2{font-size:1rem;font-stretch:112%;text-transform:uppercase;letter-spacing:.06em}
.clue{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;background:var(--panel);border:1px solid var(--line)}
.clue .rn{font:900 1.1rem var(--display);font-stretch:125%;text-align:center;padding-top:2px}
.clue p{font-family:var(--hand);font-size:1.35rem;line-height:1.2}
.clue.missing p{font-family:var(--body);font-size:.88rem;color:var(--muted)}
.clue.new{animation:clueIn .7s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes clueIn{from{opacity:0;transform:translateX(30px) rotate(3deg)}}
.plan-foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}

/* sala */
.room-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.room-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 22px;align-items:end;margin-bottom:24px}
.room-num{font:900 clamp(4rem,11vw,8rem)/.8 var(--display);font-stretch:125%;grid-row:span 2;color:var(--ink)}
.room-genre{font-size:.78rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--klein)}
.room-name{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,4.4vw,3.2rem);line-height:1.05}
.room-body{display:flex;flex-direction:column;gap:24px}
.installation{position:relative;background:var(--panel);border:1px solid var(--line);padding:clamp(14px,2.4vw,26px);display:flex;flex-direction:column;gap:14px;overflow:hidden}
.installation .spot{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 55% 70% at var(--sx,50%) -10%,rgba(255,255,255,.55),transparent 70%);opacity:0;transition:opacity 1.2s}
.lit .installation .spot{opacity:1}
.label{display:block;font-size:.8rem;color:var(--muted);border-left:3px solid var(--ink);padding-left:10px;max-width:62ch}
.label i{font-family:var(--serif);font-size:1.05rem;color:var(--ink)}
.ask{display:flex;flex-direction:column;gap:12px;padding:18px 20px;border:2px solid var(--ink);background:var(--wall)}
.ask-q{font-size:1.15rem;font-weight:600;max-width:60ch}
.ask-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ask-hint{font-size:.85rem;color:var(--muted)}
.cat{display:flex;flex-direction:column;gap:10px}
.cat-page{background:var(--panel);border:1px solid var(--line);padding:12px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;transform-origin:left center}
.cat-page b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.3rem;color:var(--klein);line-height:1}
.cat-page.new{animation:pageIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes pageIn{from{transform:perspective(800px) rotateY(-80deg);opacity:0}}
.solved{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.scheda{background:var(--panel);border:1px solid var(--line);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.scheda .num{font:900 2.4rem/1 var(--display);font-stretch:125%;color:var(--ok)}
.scheda .frm{font-family:var(--lcd-f);font-size:1.35rem;overflow-x:auto;white-space:nowrap}
.solved .memo.new{animation:memoIn .8s cubic-bezier(.2,.9,.3,1.3) .2s both}
@keyframes memoIn{from{opacity:0;transform:translateY(-40px) rotate(-12deg) scale(1.1)}}
.room-foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:.88rem;color:var(--muted)}
body.has-guide main{padding-bottom:120px}
@media (min-width:1180px){ body.has-guide .wrap{padding-right:300px} body.has-guide .sign .wrap{padding-right:max(16px,env(safe-area-inset-right,0px))} }

/* elementi comuni delle installazioni */
.sc-bar{display:flex;flex-wrap:wrap;gap:8px}
.sc-note{font-weight:600;min-height:1.5em}
.sc-note .q{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.15rem}
.empty{font-size:.85rem;color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.swing{transform-origin:50% -12px;animation:swing 1.4s cubic-bezier(.3,.6,.4,1)}
@keyframes swing{0%{transform:rotate(9deg)}25%{transform:rotate(-6deg)}50%{transform:rotate(3deg)}75%{transform:rotate(-1.5deg)}100%{transform:none}}

/* I · targhetta */
.plaque{align-self:center;background:var(--tile-w);color:#151515;padding:14px 18px 12px;box-shadow:0 8px 20px -12px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px;min-width:min(100%,380px)}
.plaque-h{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:#6A6A64}
.plaque-slots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pslot{aspect-ratio:3/4;border-bottom:2px solid #151515;display:grid;place-items:center;min-width:0}
.plaque-sub{font-family:var(--serif);font-style:italic;font-size:.95rem;color:#3F3F3A}
.floor{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:14px;background:var(--wall-2);min-height:76px;align-items:center}
.vl{width:46px;height:58px;border:0;background:#151515;color:#F5F5F0;font:800 1.7rem var(--display);font-stretch:112%;display:grid;place-items:center;border-radius:2px;box-shadow:0 3px 0 rgba(0,0,0,.35);position:relative;transition:transform .15s}
.pslot .vl{width:100%;max-width:46px;height:auto;aspect-ratio:46/58;font-size:clamp(1.1rem,3.5vw,1.7rem)}
.vl:hover{transform:translateY(-3px)}
.vl sub{position:absolute;right:4px;bottom:2px;font-size:.62rem;font-weight:700;color:var(--yellow)}
.twins{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.86rem}
.twins span{font-family:var(--lcd-f);font-size:1.2rem;background:var(--wall-2);padding:0 8px}
.twins span sub{color:var(--klein);font-size:.75rem}

/* II · monocromi */
.wallrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;padding:18px 4px 8px;border-bottom:2px solid var(--line)}
.fr{aspect-ratio:3/4;border:3px solid var(--ink);background:var(--wall);display:grid;place-items:center;position:relative;min-width:0}
.fr::before{content:"";position:absolute;top:-16px;left:50%;width:2px;height:14px;background:var(--muted)}
.cv{border:0;padding:0;width:100%;height:100%;display:block;border-radius:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.cv.R,.dot.R{background:var(--red)} .cv.B,.dot.B{background:var(--blue)} .cv.Y,.dot.Y{background:var(--yellow)}
.cv .n{font:700 .85rem var(--body);color:#fff;mix-blend-mode:normal;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.crate{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;background:var(--wall-2);min-height:96px;align-items:end}
.crate .cv{width:46px;height:62px;transition:transform .15s}
.crate .cv:hover{transform:translateY(-5px) rotate(-3deg)}

/* III · mosaico */
.mosaic{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;padding:10px;background:#8C8A80;border-radius:2px}
.ts{aspect-ratio:1;border:0;padding:0;border-radius:1px;background:repeating-linear-gradient(45deg,rgba(0,0,0,.07) 0 4px,transparent 4px 8px),#BDBAAE;transition:transform .15s}
.ts.N{background:var(--tile-b)} .ts.W{background:var(--tile-w)} .ts.G{background:linear-gradient(135deg,#F2D27A,var(--gold) 55%,#7E5C12)}
.ts:hover{transform:scale(1.06)}
.ts.flip{animation:flipT .45s ease-out}
@keyframes flipT{from{transform:perspective(300px) rotateY(180deg)}}
.palette{display:flex;flex-wrap:wrap;gap:10px}
.pal{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:999px;font-size:.85rem;background:var(--panel)}
.pal i{width:22px;height:22px;border-radius:50%;display:block;border:1px solid var(--line)}
.pal.N i{background:var(--tile-b)} .pal.W i{background:var(--tile-w)} .pal.G i{background:var(--gold)}
.pal.zero{opacity:.45}

/* I · sette colori */
.cv.O,.dot.O{background:#E8731E} .cv.G,.dot.G{background:#2E8B4F} .cv.A,.dot.A{background:#4CB8E0} .cv.V,.dot.V{background:#7B3FA0}
.choices{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;padding:0 4px;text-align:center;font-size:.7rem;line-height:1.15;color:var(--muted);animation:fadeUp .35s both}
.choices b{display:block;font:400 1.7rem var(--lcd-f);color:var(--klein)}
.choices.c5{grid-template-columns:repeat(5,minmax(0,1fr));max-width:460px;width:100%;margin:0 auto}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}

/* II · il podio */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,104px));justify-content:center;align-items:end;gap:6px;padding-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.pod-slot{width:min(64px,100%);aspect-ratio:3/4;border:2px dashed var(--line);display:grid;place-items:center}
.pod-slot .jp{width:100%;height:100%}
.pod-b{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:8px;background:var(--panel);border:2px solid var(--ink);border-bottom:0}
.pod.p0 .pod-b{height:104px} .pod.p1 .pod-b{height:80px} .pod.p2 .pod-b{height:64px}
.pod-b b{font:800 1.35rem var(--display);line-height:1}
.pod.p0 b{color:var(--gold)} .pod.p1 b{color:var(--silver)} .pod.p2 b{color:#B0703A}
.pod-b small{font-size:.64rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pod-b em{font:400 1.05rem var(--lcd-f);font-style:normal;color:var(--klein);animation:fadeUp .35s both}
.entries{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;padding:12px;background:var(--wall-2)}
.jp,.jp-gap{aspect-ratio:3/4;position:relative;min-width:0}
.jp{border:3px solid #4A3A26;padding:0;transition:transform .15s}
.jp:hover{transform:translateY(-4px)}
.jp-gap,.ls-gap{border:2px dashed var(--line)}
.jp span,.jp-gap span,.ls span,.ls-gap span{position:absolute;left:2px;top:2px;background:#F8F7F2;color:#151515;font:700 .62rem var(--body);padding:0 4px;line-height:1.4}
.jp-gap span,.ls-gap span{background:transparent;color:var(--muted)}
.jp.k0{background:linear-gradient(90deg,var(--red) 0 50%,#F2F1EA 50%)}
.jp.k1{background:radial-gradient(circle,var(--yellow) 0 35%,#1A1A1A 36%)}
.jp.k2{background:repeating-linear-gradient(0deg,#2E7D4F 0 6px,#F2F1EA 6px 12px)}
.jp.k3{background:linear-gradient(135deg,var(--blue) 0 50%,var(--yellow) 50%)}
.jp.k4{background:conic-gradient(var(--red) 0 25%,#F2F1EA 0 50%,var(--blue) 0 75%,#F2F1EA 0)}
.jp.k5{background:radial-gradient(circle at 30% 30%,#F4D24A 0 9%,transparent 10%),radial-gradient(circle at 72% 24%,#F4D24A 0 6%,transparent 7%),#1C3C8C}
.jp.k6{background:linear-gradient(#9CC8E8 0 55%,#4F8A3C 55%)}
.jp.k7{background:repeating-linear-gradient(45deg,#151515 0 5px,#F2F1EA 5px 10px)}
.jp.k8{background:radial-gradient(circle at 50% 36%,#2B2014 0 17%,transparent 18%),radial-gradient(ellipse 40% 34% at 50% 80%,#2B2014 0 98%,transparent 100%),linear-gradient(#7C8A5C,#A88B4E)}

/* regole */
.rule{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.rule.ok{color:var(--ok);border-color:currentColor} .rule.no{color:var(--bad);border-color:currentColor} .rule.na{color:var(--muted)}
.jp-tag{position:absolute;left:0;right:0;bottom:-2px;font:700 .55rem var(--body);font-style:normal;text-transform:uppercase;letter-spacing:.06em;background:var(--bad);color:#fff;text-align:center;line-height:1.5}
.pod-rule{font:600 .58rem var(--body);font-style:normal;color:var(--bad);text-transform:uppercase;letter-spacing:.06em}
.ts.clash{box-shadow:0 0 0 3px var(--bad);animation:shake .35s}

/* III · mosaico da 5 */
.mosaic.m5{grid-template-columns:repeat(5,minmax(0,1fr));max-width:460px;width:100%;margin:0 auto;gap:6px}

/* V · il prestito */
.lwall{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;padding:14px 4px 10px;border-bottom:2px solid var(--line)}
.ls,.ls-gap{aspect-ratio:4/3;position:relative;min-width:0}
.ls{border:3px solid #3A2E20;padding:0;transition:transform .15s}
.ls.m{background:radial-gradient(circle at var(--sx) 24%,var(--sun) 0 9%,transparent 10%),conic-gradient(from 135deg at 46% 30%,var(--c) 0 90deg,transparent 0),linear-gradient(var(--sky) 0 72%,#5E8C4A 72%)}
.ls.s{background:radial-gradient(circle at var(--sx) 24%,var(--sun) 0 9%,transparent 10%),linear-gradient(var(--sky) 0 55%,transparent 55%),repeating-linear-gradient(0deg,rgba(255,255,255,.3) 0 1.5px,transparent 1.5px 6px),var(--c)}
.ls:hover{transform:translateY(-4px)}
.loan,.envelope{display:flex;flex-direction:column;align-items:center;gap:6px}
.loan-l,.env-l{font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lbox{display:grid;grid-template-columns:repeat(4,minmax(0,92px));gap:10px;padding:14px;max-width:100%;background:repeating-linear-gradient(90deg,#C49A62 0 22px,#B78A52 22px 24px);border:4px solid #7A5634}
.box-slot{aspect-ratio:4/3;border:2px dashed rgba(0,0,0,.35);min-width:0}

/* VI · il bookshop */
.stacks{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 18px;padding:14px;background:var(--wall-2)}
.stack{position:relative;width:72px;height:116px;border:0;background:none;padding:0}
.stack .pc{position:absolute;left:7px;top:4px;width:58px;transition:transform .2s}
.stack .pc:nth-child(1){transform:rotate(-7deg) translate(-3px,3px)} .stack .pc:nth-child(2){transform:rotate(5deg) translate(3px,1px)}
.stack:hover .pc:nth-child(3){transform:translateY(-7px) rotate(-2deg)}
.stack small{position:absolute;left:-6px;right:-6px;bottom:0;font-size:.64rem;line-height:1.1;color:var(--muted);text-align:center}
.pc{display:block;aspect-ratio:3/4;border:3px solid #FBFAF5;box-shadow:0 2px 6px rgba(0,0,0,.3);padding:0;min-width:0;border-radius:2px}
.pc.M{background:radial-gradient(circle at 50% 36%,#2B2014 0 17%,transparent 18%),radial-gradient(ellipse 40% 34% at 50% 80%,#2B2014 0 98%,transparent 100%),linear-gradient(#7C8A5C,#A88B4E)}
.pc.N{background:radial-gradient(circle at 30% 30%,#F4D24A 0 7%,transparent 8%),radial-gradient(circle at 70% 22%,#F4D24A 0 6%,transparent 7%),repeating-radial-gradient(circle at 40% 55%,#1C3C8C 0 6%,#3060B8 6% 11%),#1C3C8C}
.pc.A{background:linear-gradient(90deg,var(--red) 0 50%,#F2F1EA 50%)}
.pc.B{background:radial-gradient(circle,var(--yellow) 0 35%,#1A1A1A 36%)}
.pc.C{background:repeating-linear-gradient(0deg,#2E7D4F 0 6px,#F2F1EA 6px 12px)}
.env-in{display:grid;grid-template-columns:repeat(6,minmax(0,58px));max-width:100%;gap:10px;padding:16px 18px;background:linear-gradient(#E6D6B4,#D8C49A);border-radius:4px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.env-in .pc{width:100%}
.env-in .pc:hover{transform:translateY(-4px)}
.env-in .pc.drop{animation:pcDrop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pcDrop{from{transform:translateY(-46px) rotate(-10deg);opacity:0}}
.pc-slot{aspect-ratio:3/4;border-color:rgba(0,0,0,.25)}
.sb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:36px;animation:fadeUp .35s both}
.sb-g{display:inline-flex;gap:4px;min-width:4px}
.sb .st{width:16px;height:16px;border-radius:50%;background:var(--klein);display:block}
.sb .br{width:4px;height:32px;background:var(--ink);display:block;border-radius:2px}
.sb-l{text-align:center;font-size:.8rem;color:var(--muted);margin:0}
@media (max-width:560px){ .stacks{gap:12px 10px;padding:12px 8px} .stack{width:56px;height:96px} .stack .pc{width:44px;left:6px} .lwall,.entries{grid-template-columns:repeat(5,minmax(0,1fr))} .choices{gap:4px;font-size:.6rem} .choices b{font-size:1.3rem} }

/* porta di sicurezza */
.door-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.monitor{background:#0B0F0A;color:#9CF09C;font-family:var(--lcd-f);padding:18px;border:10px solid var(--device);border-radius:6px;box-shadow:inset 0 0 40px rgba(80,255,120,.08);min-height:260px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.monitor::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 2px,transparent 2px 4px)}
.mon-big{font-size:3.6rem;line-height:1;color:#C9FFC9}
.mon-l{font-size:1.25rem;line-height:1.15}
.mon-l.dim{opacity:.6}
.mon-clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:1.15rem}
.mon-clues .ok{color:#9CF09C}.mon-clues .no{color:#FF8A7A}.mon-clues .na{color:#6F8F6F}
.monitor.alarm{animation:alarm .5s 3}
@keyframes alarm{50%{background:#3A0A08}}
.hooks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:18px 4px 8px;border-bottom:2px solid var(--line)}
.exitdoor{position:relative;height:120px;border:4px solid var(--ink);border-bottom:0;overflow:hidden;background:linear-gradient(#FFFDF2,#FFF6CC)}
.exitdoor .gl{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,var(--wall-2),var(--panel));border:2px solid var(--ink);transition:transform 1.4s cubic-bezier(.6,0,.2,1)}
.exitdoor .gl.l{left:0}.exitdoor .gl.r{right:0}
.exitdoor.open .gl.l{transform:translateX(-100%)}.exitdoor.open .gl.r{transform:translateX(100%)}
.exitdoor .sg{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--ok);color:#fff;font:700 .7rem var(--body);letter-spacing:.12em;padding:3px 8px;z-index:2}

/* audioguida */
.guide{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:30;width:250px;background:var(--device);color:#E9E9E4;border-radius:22px 22px 26px 26px;padding:14px 14px 16px;box-shadow:0 24px 40px -18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;gap:10px}
.g-top{display:flex;justify-content:space-between;align-items:center;font-size:.62rem;letter-spacing:.24em;font-weight:700;opacity:.8}
.g-led{width:8px;height:8px;border-radius:50%;background:#444;transition:background .2s,box-shadow .2s}
.g-led.ok{background:#5BF08A;box-shadow:0 0 8px #5BF08A}.g-led.bad{background:#FF5A4A;box-shadow:0 0 8px #FF5A4A}
.g-screen{background:var(--lcd);color:var(--lcd-ink);font-family:var(--lcd-f);border-radius:6px;padding:8px 10px;min-height:86px;box-shadow:inset 0 2px 6px rgba(0,0,0,.35);position:relative;overflow:hidden}
.g-l1{font-size:1rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-l2{font-size:2.2rem;line-height:1.05;letter-spacing:.1em;min-height:2.3rem}
.g-wave{display:flex;gap:3px;height:14px;align-items:end}
.g-wave i{flex:1;background:var(--lcd-ink);height:2px;opacity:.5}
.g-screen.play .g-wave i{animation:wave .5s ease-in-out infinite alternate;animation-delay:calc(var(--k)*-70ms);opacity:.9}
@keyframes wave{to{height:14px}}
.g-screen.err{animation:static .4s steps(4) 2}
@keyframes static{25%{filter:contrast(2) brightness(1.4);transform:translateX(2px)}50%{transform:translateX(-2px)}75%{filter:none}}
.g-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.g-keys button{height:40px;border:0;border-radius:10px;background:var(--device-2);color:#F0F0EA;font:600 1.15rem var(--body);box-shadow:0 2px 0 rgba(0,0,0,.5);transition:transform .06s,background .15s}
.g-keys button:active,.g-keys button.press{transform:translateY(2px);box-shadow:none;background:#55575D}
.g-keys .g-ok{background:var(--klein);color:var(--on-klein)}
.g-hint{font-size:.66rem;opacity:.6;text-align:center}
.g-fold{display:none}
@media (max-width:640px){
  .guide{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));width:auto;border-radius:18px;padding:10px 12px 12px}
  .g-fold{display:block;background:transparent;border:1px solid rgba(255,255,255,.25);color:#EEE;border-radius:999px;font-size:.72rem;padding:3px 10px}
  .guide.folded .g-keys,.guide.folded .g-hint{display:none}
  .g-screen{min-height:0}
  body.has-guide main{padding-bottom:360px}
  body.has-guide.gfold main{padding-bottom:180px}
}

/* passaggi */
.veil{position:fixed;inset:0;z-index:60;background:#000;opacity:0;pointer-events:none}
.veil.block{pointer-events:auto}
.bars{position:fixed;inset:0;z-index:61;pointer-events:none;display:grid;grid-template-rows:1fr 1fr 1fr}
.bars i{display:block;transform:translateX(-101%)}
.bars i:nth-child(1){background:var(--red)}.bars i:nth-child(2){background:var(--yellow);transform:translateX(101%)}.bars i:nth-child(3){background:var(--blue)}
.flash{position:fixed;inset:0;z-index:70;background:#fff;opacity:0;pointer-events:none}

/* fine: l'opera della squadra */
.vernissage{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:36px;align-items:center}
.opera{position:relative;padding:18px;background:#1A140C;box-shadow:0 30px 50px -25px rgba(0,0,0,.7);overflow:hidden}
.opera svg{display:block;width:100%;height:auto}
.velo{position:absolute;inset:0;z-index:2;background:repeating-linear-gradient(95deg,#8E8C86 0 18px,#A8A6A0 18px 40px,#7E7C76 40px 52px);box-shadow:inset 0 -30px 40px rgba(0,0,0,.3);transform-origin:top center}
.velo.off{animation:veloOff 1.4s cubic-bezier(.6,0,.4,1) .9s both}
@keyframes veloOff{30%{transform:skewX(-4deg) translateY(-3%)}100%{transform:translateY(115%) skewX(6deg)}}
.didascalia{display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--ink);padding-left:16px}
.d-artist{font:800 1.6rem/1.1 var(--display);font-stretch:112%;overflow-wrap:anywhere}
.d-title{font-family:var(--serif);font-style:italic;font-size:1.6rem;line-height:1.1}
.d-meta{font-size:.92rem;color:var(--muted)}
.d-inv{font-family:var(--lcd-f);font-size:1.1rem;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:10px}
.stat b{display:block;font:400 2.2rem/1 var(--lcd-f)}
.stat span{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.recap{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.recap div{background:var(--panel);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.recap .rn{font:900 1.3rem var(--display);font-stretch:125%}
.recap .frm{font-family:var(--lcd-f);font-size:1.15rem;overflow-x:auto;white-space:nowrap}
.recap .ans{font-weight:700;color:var(--ok)}
.seq{display:flex;gap:6px}
.seq i{width:28px;height:38px;display:block}
.dot{display:inline-block;width:14px;height:14px;border-radius:2px;vertical-align:-2px}
.section-t{font-size:1rem;font-stretch:112%;text-transform:uppercase;letter-spacing:.06em;margin:36px 0 12px}

@media (max-width:860px){
  .poster,.intro-cols,.plan-grid,.solved,.door-grid,.vernissage,.route{grid-template-columns:minmax(0,1fr)}
  .p-art{min-height:220px}
  .intro-cols{gap:28px}
  .wallrow{gap:5px}
  .shelf{gap:3px}
  .pic{border-width:3px}
  .pic .tg{display:none}
  .vl{width:40px;height:50px;font-size:1.4rem}
}
/* ===== corridoio delle sale ===== */
.cview{display:flex;flex-direction:column;gap:22px;will-change:transform}
.c-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.c-head h1{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,4.6vw,3.2rem);line-height:1}
.c-head p{max-width:44ch;color:var(--muted)}
.corr{position:relative;overflow-x:auto;overflow-y:hidden;border:3px solid var(--ink);background:var(--panel);scrollbar-width:thin;outline:none}
.corr:focus-visible{box-shadow:0 0 0 3px var(--klein)}
.track{position:relative;display:flex;align-items:flex-end;width:max-content;min-width:100%;height:380px;padding:0 70px;
  background:linear-gradient(var(--wall-2) 0 38px,var(--ink) 38px 41px,transparent 41px),linear-gradient(transparent 0 calc(100% - 118px),var(--line) calc(100% - 118px) calc(100% - 115px),transparent 0),var(--panel)}
.c-floor{position:absolute;left:0;right:0;bottom:0;height:84px;overflow:hidden;border-top:3px solid var(--ink)}
.c-floor::before{content:"";position:absolute;left:-10%;right:-10%;top:0;height:220px;transform-origin:top center;transform:perspective(260px) rotateX(58deg);
  background:repeating-conic-gradient(var(--ink) 0 25%,var(--panel) 0 50%) 0 0/46px 46px}
.bay{position:relative;display:flex;align-items:flex-end;gap:34px;padding-right:34px;padding-bottom:84px;z-index:1}
.dcol{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
.lamp{position:absolute;top:-158px;left:50%;width:34px;height:10px;margin-left:-17px;background:var(--ink);border-radius:0 0 8px 8px}
.cone{position:absolute;top:-148px;left:50%;width:170px;height:150px;margin-left:-85px;pointer-events:none;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);
  background:linear-gradient(var(--light-in),transparent);opacity:0;transition:opacity .6s}
.dcol:hover .cone,.dcol.here .cone{opacity:.45}
.dcol.solved .cone{opacity:.8}
.plaque2{font:900 1.05rem var(--display);font-stretch:125%;background:var(--ink);color:var(--wall);padding:2px 10px;min-width:44px;text-align:center;position:relative;z-index:2}
.dcol.solved .plaque2::after{content:"✓";margin-left:6px;color:var(--yellow)}
.door-b{position:relative;width:106px;height:178px;padding:0;border:6px solid var(--ink);border-bottom:0;background:var(--light-in);perspective:700px;display:block}
.door-b .leaf{position:absolute;inset:0;background:var(--door);transform-origin:left center;transition:transform .55s cubic-bezier(.5,0,.2,1);
  box-shadow:inset 0 0 0 8px var(--door),inset 0 0 0 10px var(--door-2)}
.door-b .leaf::before{content:"";position:absolute;left:14px;right:14px;top:16px;height:58px;border:2px solid var(--door-2)}
.door-b .leaf::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:22px;background:var(--gold);border-radius:3px}
.door-b:hover .leaf{transform:rotateY(-12deg)}
.door-b.opening .leaf,.door-b.ajar .leaf,.dcol.solved .door-b .leaf{transform:rotateY(-72deg)}
.door-b .inside{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,#FFFFFF,transparent 70%)}
.door-b:focus-visible{outline:3px solid var(--klein);outline-offset:3px}
.mini{width:66px;height:84px;border:5px solid var(--ink);margin-bottom:72px;box-shadow:0 8px 14px -8px rgba(0,0,0,.4);position:relative}
.mini::before{content:"";position:absolute;top:-22px;left:50%;width:1px;height:18px;background:var(--muted)}
.mini.a0{background:linear-gradient(90deg,var(--red) 0 60%,var(--tile-w) 60% 64%,var(--yellow) 64%)}
.mini.a1{background:radial-gradient(circle at 50% 45%,var(--blue) 0 30%,var(--tile-w) 31%)}
.mini.a2{background:repeating-linear-gradient(0deg,var(--ink) 0 8px,var(--tile-w) 8px 16px)}
.mini.a3{background:linear-gradient(var(--yellow) 0 40%,var(--ink) 40% 44%,var(--blue) 44%)}
.mini.a4{background:conic-gradient(var(--red) 0 25%,var(--tile-w) 0 50%,var(--blue) 0 75%,var(--tile-w) 0)}
.mini.a5{background:linear-gradient(135deg,var(--tile-w) 0 45%,var(--red) 45% 55%,var(--tile-w) 55%)}
.dcol.exit .door-b{border-color:var(--ink);background:#FFFFFF}
.dcol.exit .door-b .leaf{background:var(--red);box-shadow:inset 0 0 0 8px var(--red),inset 0 0 0 10px rgba(0,0,0,.25)}

@keyframes legA{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}

/* ===== guida per chi organizza ===== */

/* ===== esito della risposta: giusta e sbagliata ===== */
.fxo{position:fixed;inset:0;z-index:66;pointer-events:none;overflow:hidden}
.fx-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,rgba(255,236,170,.6),transparent 62%);opacity:0}

.fx-stamp small{display:block;font:700 .8rem var(--body);letter-spacing:.14em;margin-top:6px;font-stretch:100%}
@keyframes quake{10%,50%,90%{transform:translateX(-9px)}30%,70%{transform:translateX(9px)}}

<script>

function noise(t0,dur,vol,freq,type,f2){ const a=ac(); if(!a) return; const n=Math.ceil(a.sampleRate*dur), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);

}

function rankHtml(me, opts){
  opts=opts||{}; const l=board(), shown=l.slice(0,15);
  const rows=shown.map((r,k)=>`<tr class="${r.at===me?'me':''}${k<3?' top'+(k+1):''}"><td class="rk">${k+1}</td><td class="nm">${esc(r.team)}</td><td class="r">${mmss(realOf(r))}</td><td class="r">${r.errors}</td><td class="r">${r.hints}</td><td class="r fin">${mmss(r.sec)}</td></tr>`).join('');
  return `<section class="rank" aria-label="Classifica"><div class="rank-h"><h2>Classifica</h2><span>${l.length} ${l.length===1?'squadra':'squadre'}</span></div>
  <p class="rank-rule">Tempo finale = tempo impiegato + <b>1 minuto per ogni errore</b> + <b>3 minuti per ogni scheda</b> del catalogo. Vince il tempo finale più basso.</p>
  ${l.length ? `<div class="table-wrap"><table class="rank-t"><thead><tr><th>#</th><th>Squadra</th><th class="r">Tempo</th><th class="r">Errori</th><th class="r">Schede</th><th class="r">Finale</th></tr></thead><tbody>${rows}</tbody></table></div>${l.length>15?'<p class="small">Sono mostrate le prime 15 squadre.</p>':''}`
    : '<p class="empty">Ancora nessuna squadra: la prima che esce dal museo apre la classifica.</p>'}
  ${opts.add ? `<div class="rank-add"><label for="rcode">Una squadra ha giocato su un altro computer? Incolla qui il suo codice risultato.</label>
    <div class="sc-bar"><input id="rcode" placeholder="GS-…" autocomplete="off" spellcheck="false"><button type="button" class="chip" id="rcode-add">Aggiungi alla classifica</button></div>
    <p class="small" id="rcode-msg" aria-live="polite">${esc(rankMsg)}</p></div>` : ''}
  ${opts.clear && l.length ? (confirmClear ? '<p class="sc-bar"><span>Cancellare tutta la classifica?</span><button type="button" class="chip" id="gb-yes">Sì, cancella</button><button type="button" class="chip" id="gb-no">Annulla</button></p>' : '<p><button type="button" class="chip" id="gb-clear">Cancella classifica</button></p>') : ''}</section>`;
}
function resultHtml(){
  if(S.noClock) return `<section class="result"><p class="cap">Il vostro risultato</p><p>La partita è finita dopo l'allarme delle 01:00: non entra in classifica.</p></section>`;
  const l=board(), pos=l.findIndex(r=>r.at===S.recId)+1, me=l.find(r=>r.at===S.recId); if(!me) return '';
  return `<section class="result"><p class="cap">Il vostro risultato</p>
  <div class="res-sum"><span><small>Tempo impiegato</small><b>${mmss(realOf(me))}</b></span><i>+</i><span><small>${me.errors} ${me.errors===1?'errore':'errori'} × 1 min</small><b>${mmss(me.errors*ERR_COST)}</b></span><i>+</i><span><small>${me.hints} ${me.hints===1?'scheda':'schede'} × 3 min</small><b>${mmss(me.hints*HINT_COST)}</b></span><i>=</i><span class="fin"><small>Tempo finale</small><b>${mmss(me.sec)}</b></span></div>
  <p class="res-pos"><b>${pos}°</b> posto su ${l.length} in questa classifica</p>
  <div class="res-code"><label for="mycode">Codice risultato: mandatelo a chi organizza, così entrate nella classifica comune.</label>
    <div class="sc-bar"><input id="mycode" readonly value="${resultCode(me)}"><button type="button" class="chip" id="copy-code">Copia</button></div><p class="small" id="copy-msg" aria-live="polite"></p></div></section>`;
}

/* sequenze della porta: tutte le file di 2 rosse, 2 blu, 2 gialle */
const ALLSEQ = (()=>{ const out=[]; (function go(p,c){ if(p.length===6){ out.push(p); return } for(const k of 'RBY') if(c[k]){ c[k]--; go(p+k,c); c[k]++ } })('',{R:2,B:2,Y:2}); return out })();
function pred(p){
  if(p.t==='is') return s=>s[p.i]===p.c;
  if(p.t==='not') return s=>s[p.i]!==p.c;
  if(p.t==='apart') return s=>s.lastIndexOf(p.c)-s.indexOf(p.c)>1;
  return ()=>true;
}
function clues(){ return Object.keys(S.solved).map(Number).sort((a,b)=>a-b).map(i=>({i, ...reveal(i,S.solved[i]).clue})) }

function shuffle(a){ for(let j=a.length-1;j>0;j--){ const r=Math.floor(Math.random()*(j+1)); [a[j],a[r]]=[a[r],a[j]] } return a }

 /* IV · permutazioni con ripetizione: anagrammi di GIOTTO */
 3:{ init:()=>({slots:Array(6).fill(null), twins:false, seen:new Set(), note:''}),
  view:s=>{
    const tile=(id,a,v)=>`<button type="button" class="vl" data-a="${a}" data-v="${v}" data-id="v${id}" aria-label="Lettera ${GL[id]}${s.twins&&SUB[id]?' '+SUB[id]:''}">${GL[id]}${s.twins&&SUB[id]?`<sub>${SUB[id]}</sub>`:''}</button>`;

      const o=s.slots.map((id,k)=>GL[id]==='O'?k:-1).filter(k=>k>=0), t=s.slots.map((id,k)=>GL[id]==='T'?k:-1).filter(k=>k>=0), vs=[];
      for(const oo of [['₁','₂'],['₂','₁']]) for(const tt of [['₁','₂'],['₂','₁']]){
        vs.push(s.slots.map((id,k)=>{ const c=GL[id]; const sub=c==='O'?oo[o.indexOf(k)]:c==='T'?tt[t.indexOf(k)]:''; return c+(sub?`<sub>${sub}</sub>`:'') }).join('')) }

    }

    <div class="floor">${tray.map(id=>tile(id,'on',id)).join('')||'<span class="empty">Tutte le lettere sono sulla targhetta.</span>'}</div>
    ${tw}
    <div class="sc-bar">${full?rule(/TT/.test(s.slots.map(id=>GL[id]).join(''))?'no':'ok','Le due T non sono vicine','Le due T sono vicine',''):rule('na','','','Regola: le due T mai vicine')}<button type="button" class="chip${s.twins?' on':''}" data-a="twins" aria-pressed="${s.twins}">Distingui le copie</button><button type="button" class="chip" data-a="reset">Stacca tutte</button></div>
    <p class="sc-note">${s.note||'Clicca le lettere per attaccarle alla targhetta. Parole valide composte: '+s.seen.size}</p>` },

 /* V · combinazioni semplici: il prestito */
 4:{ init:()=>({pick:[], seen:new Set(), orders:new Set(), note:''}),
  view:s=>{
    const ls=(id,a)=>{ const [k,sky,c,sx,sun]=LS[id]; return `<button type="button" class="ls ${k}" style="--sky:${sky};--c:${c};--sx:${sx};--sun:${sun}" data-a="${a}" data-v="${id}" data-id="l${id}" aria-label="${k==='s'?'Marina':'Montagna'} numero ${id+1}${a==='off'?', nella cassa: clicca per riappenderla':''}"><span>${id+1}</span></button>` };

    const inBox=[...s.pick].sort((x,y)=>x-y);

    <div class="loan"><span class="loan-l">Cassa per Parigi · marine ${ns} di 2 · montagne ${nm} di 2</span><div class="lbox">${inBox.map(id=>ls(id,'off')).join('')}${'<div class="box-slot"></div>'.repeat(4-inBox.length)}</div></div>

  act:(s,a,v)=>{ const id=+v;

    if(s.pick.length>=4){ s.note='La cassa è piena: togli un paesaggio o svuotala.'; return {sound:'bad'} }

    s.pick.push(id);
    if(s.pick.length<4){ s.note=''; return {sound:'hang'} }
    const ord=s.pick.join('-'), grp=[...s.pick].sort((x,y)=>x-y), key=grp.join('-'), isNew=!s.seen.has(key), newOrd=!s.orders.has(ord); s.seen.add(key); s.orders.add(ord);
    s.note = isNew ? `Gruppo nuovo per Parigi: paesaggi ${grp.map(x=>x+1).join(', ')}. Gruppi diversi: ${s.seen.size}.`

      : `Questo gruppo l'avevi già scelto. Gruppi diversi: ${s.seen.size}.`;
    return {sound:isNew?'hang':'bad'} } },

const SC = {};
function st(k){ return SC[k] || (SC[k] = SCENES[k].init()) }
function rerender(fig, k, mutate){
  const before=new Map(); fig.querySelectorAll('[data-id]').forEach(el=>before.set(el.dataset.id, el.getBoundingClientRect()));
  const ae=document.activeElement, fid=ae && fig.contains(ae) ? ae.dataset.id : null;
  const r=mutate();
  fig.querySelector('.sc-body').innerHTML=SCENES[k].view(st(k));
  if(fid){ const f=fig.querySelector(`[data-id="${fid}"]`); if(f) f.focus({preventScroll:true}) }
  SCENES[k].after && SCENES[k].after(fig, st(k));
  if(!RM) fig.querySelectorAll('[data-id]').forEach(el=>{ const b=before.get(el.dataset.id); if(!b) return; const a=el.getBoundingClientRect(), dx=b.left-a.left, dy=b.top-a.top;
    if(Math.abs(dx)+Math.abs(dy)>1) el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:480,easing:'cubic-bezier(.2,.8,.2,1.1)'}) });
  return r;
}
function mountScene(fig){
  const k=fig.dataset.scene; SCENES[k].after && SCENES[k].after(fig, st(k));
  fig.addEventListener('click', e=>{
    const t=e.target.closest('[data-a]'); if(!t || !fig.contains(t) || t.disabled) return;
    if(busy) return;
    const r=rerender(fig, k, ()=>SCENES[k].act(st(k), t.dataset.a, t.dataset.v)) || {};
    if(r.sound) sfx(r.sound);
    if(r.bad) restartAnim(fig.querySelector(`[data-id="${r.bad}"]`), 'shake');
    if(r.mon) updateMonitor();
    if(r.open) tryDoor();
  });
}

/* l'opera della squadra: composizione generata dal nome e dal tempo */
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296 } }
function artwork(){
  const R=rng(fnv((S.team||'')+'|'+elapsed())), W=600, H=420, L=8, COLS={R:'#CC2E1E',B:'#1F45C4',Y:'#E9AE06'}, seq=S.seq||'RBYRBY';
  const xs=[0], cols=3; let acc=0; const ws=[R()+.6,R()+.6,R()+.6], sw=ws.reduce((a,b)=>a+b); for(let i=0;i<cols;i++){ acc+=ws[i]/sw*W; xs.push(Math.round(acc)) }
  const cells=[]; for(let c=0;c<cols;c++){ const parts=2+(R()<.5?1:0); const hs=Array.from({length:parts},()=>R()+.5), hsum=hs.reduce((a,b)=>a+b); let y=0;
    for(let p=0;p<parts;p++){ const h=p===parts-1?H-y:Math.round(hs[p]/hsum*H); cells.push({x:xs[c],y,w:xs[c+1]-xs[c],h}); y+=h } }
  const idx=[]; while(idx.length<Math.min(6,cells.length)){ const k=Math.floor(R()*cells.length); if(!idx.includes(k)) idx.push(k) } idx.sort((a,b)=>a-b);
  const fill=cells.map((c,k)=>{ const j=idx.indexOf(k); return j>=0?COLS[seq[j]]:'#F3F1EA' });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Composizione astratta di riquadri rossi, blu e gialli"><rect width="${W}" height="${H}" fill="#111"/>${cells.map((c,k)=>`<rect x="${c.x+L/2}" y="${c.y+L/2}" width="${Math.max(0,c.w-L)}" height="${Math.max(0,c.h-L)}" fill="${fill[k]}"/>`).join('')}</svg>`;
}

    if(S.solved[i]!=null){ $('gl1').textContent='TRACCIA GIÀ ASCOLTATA'; gEntry=''; return }
    if(check(i,a)){ S.solved[i]=a; gEntry=''; save(); sfx('ok'); fxOk(a);
      sc.classList.add('play'); $('gled').className='g-led ok'; $('gl1').textContent=`▶ TRACCIA ${a} · NOTA DEL CURATORE`; $('gl2').textContent=a;
      S._newSolve=true; render({stay:true}); S._newSolve=false; S._fresh=i;
      setTimeout(()=>{ if(S.view==='room') guideIdle() }, 3200);
    } else { S.errors++; gEntry=''; save(); sfx('bad'); fxBad('Traccia non trovata', `Hai digitato ${fmt(a)} · +1 minuto`); sc.classList.remove('err'); void sc.offsetWidth; sc.classList.add('err'); $('gled').className='g-led bad';
      $('gl1').textContent=`TRACCIA ${a} NON TROVATA`; $('gl2').textContent='— — —'; penalty(ERR_COST,'+1 min'); setTimeout(()=>{ if(S.view==='room') guideIdle() }, 1800) }
  } else if(S.view==='door'){
    if(S.doorOn){ $('gl1').textContent='SISTEMA GIÀ ATTIVO'; gEntry=''; return }
    if(check('d1',a)){ S.doorOn=true; gEntry=''; save(); sfx('ok'); fxOk(a); sc.classList.add('play'); $('gled').className='g-led ok'; $('gl1').textContent='▶ MONITOR ATTIVATO'; $('gl2').textContent=a;
      lastMon=ALLSEQ.length; updateMonitor(); const f=document.querySelector('[data-scene="door"]'); if(f) rerender(f,'door',()=>{});
      setTimeout(()=>{ if(S.view==='door') guideIdle() }, 2600);
    } else { S.errors++; gEntry=''; save(); sfx('bad'); fxBad('Numero non valido', `Hai digitato ${fmt(a)} · +1 minuto`); restartAnim(sc,'err'); $('gled').className='g-led bad'; $('gl1').textContent='NUMERO NON VALIDO'; $('gl2').textContent='— — —'; penalty(ERR_COST,'+1 min'); setTimeout(()=>{ if(S.view==='door') guideIdle() }, 1800) }
  }
}
document.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>guideKey(b.dataset.g)));
$('g-fold').addEventListener('click',()=>{ const g=$('guide'), f=g.classList.toggle('folded'); document.body.classList.toggle('gfold',f); $('g-fold').textContent=f?'Apri tastiera':'Chiudi tastiera' });
document.addEventListener('keydown', e=>{
  if(!['room','door'].includes(S.view) || e.ctrlKey || e.metaKey || e.altKey) return;
  const t=e.target, typing = t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA');
  if(typing) return;
  if(/^[0-9]$/.test(e.key)){ guideKey(e.key); e.preventDefault() }
  else if(e.key==='Backspace'){ guideKey('del'); e.preventDefault() }
  else if(e.key==='Enter' && (t===document.body || (t.closest && t.closest('#guide')))){ guideKey('ok'); e.preventDefault() }
});

/* ===== passaggi ===== */
function veilTo(o, ms, delay){ const v=$('veil'); if(RM){ v.style.opacity=o; return Promise.resolve() } return v.animate([{opacity:getComputedStyle(v).opacity},{opacity:o}],{duration:ms,delay:delay||0,fill:'forwards',easing:'ease-in-out'}).finished.then(()=>{ v.style.opacity=o }) }
async function lightsOn(){
  const v=$('veil');
  if(RM){ v.style.opacity=0; v.classList.remove('block'); document.querySelector('main').classList.add('lit'); return }
  const steps=[1]; const n=2+Math.floor(Math.random()*3); for(let k=0;k<n;k++){ steps.push(.15+Math.random()*.3, .75+Math.random()*.25) } steps.push(0);
  const frames=steps.map((o,k)=>({opacity:o, offset:k/(steps.length-1)}));
  sfx('sw'); setTimeout(()=>sfx('sw'),180);
  await v.animate(frames,{duration:650+n*120,fill:'forwards',easing:'steps(1,end)'}).finished; v.style.opacity=0; v.getAnimations().forEach(a=>a.cancel());
  v.classList.remove('block');
  setTimeout(()=>document.querySelector('main').classList.add('lit'),60);
}
async function zoomInto(sel, swap){
  const tgt=document.querySelector(sel), stage=$('planStage');
  busy=true; $('veil').classList.add('block');
  if(!RM && tgt && stage){
    const r=tgt.getBoundingClientRect(), b=stage.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, s=Math.max(innerWidth/r.width, innerHeight/r.height)*1.1;
    stage.style.transformOrigin=`${cx-b.left}px ${cy-b.top}px`; sfx('steps');
    const an=stage.animate([{transform:'none'},{transform:`translate(${innerWidth/2-cx}px,${innerHeight/2-cy}px) scale(${s})`}],{duration:850,easing:'cubic-bezier(.65,0,.25,1)',fill:'forwards'});
    await Promise.all([an.finished, veilTo(1,420,430)]);
  } else await veilTo(1,0);
  swap(); window.scrollTo(0,0);
  await lightsOn(); busy=false;
}
async function zoomOutTo(sel, swap){
  busy=true; $('veil').classList.add('block'); sfx('sw');
  await veilTo(1, RM?0:260);
  swap(); window.scrollTo(0,0);
  const tgt=document.querySelector(sel), stage=$('planStage');
  if(!RM && tgt && stage){
    const r=tgt.getBoundingClientRect(), b=stage.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, s=Math.max(innerWidth/r.width, innerHeight/r.height)*1.1;
    stage.style.transformOrigin=`${cx-b.left}px ${cy-b.top}px`; sfx('steps');
    const an=stage.animate([{transform:`translate(${innerWidth/2-cx}px,${innerHeight/2-cy}px) scale(${s})`},{transform:'none'}],{duration:850,easing:'cubic-bezier(.65,0,.25,1)'});
    await Promise.all([an.finished, veilTo(0,380)]);
  } else await veilTo(0,0);
  $('veil').classList.remove('block'); busy=false;
}
async function paintBars(swap){
  const b=$('bars'); busy=true;
  if(RM){ swap(); busy=false; return }
  b.hidden=false; const bars=[...b.children]; sfx('swoosh');
  await Promise.all(bars.map((el,k)=>el.animate([{transform:`translateX(${k===1?101:-101}%)`},{transform:'none'}],{duration:520,delay:k*90,easing:'cubic-bezier(.7,0,.3,1)',fill:'forwards'}).finished));
  swap(); window.scrollTo(0,0); sfx('swoosh');
  await Promise.all(bars.map((el,k)=>el.animate([{transform:'none'},{transform:`translateX(${k===1?-101:101}%)`}],{duration:520,delay:k*90,easing:'cubic-bezier(.7,0,.3,1)',fill:'forwards'}).finished));
  bars.forEach(el=>el.getAnimations().forEach(a=>a.cancel())); b.hidden=true; busy=false;
}
async function tryDoor(){
  const h=st('door').h, C=['R','B','Y','R','B','Y'];
  if(!S.doorOn || h.includes(null) || busy) return;
  const seq=h.map(id=>C[id]).join('');
  if(!check('d2',seq)){
    S.errors++; save(); sfx('alarm'); fxBad('Sequenza rifiutata', 'Controlla i biglietti · +1 minuto'); restartAnim($('monitor'),'alarm'); penalty(ERR_COST,'+1 min');
    const f=document.querySelector('[data-scene="door"]'); rerender(f,'door',()=>{ st('door').note='Allarme breve: la sequenza non è quella del curatore. Controlla i biglietti sul monitor.' }); return }
  busy=true; S.finished=Date.now(); S.seq=seq; save(); sfx('door');
  const d=$('exitdoor'); if(d) d.classList.add('open');
  await wait(RM?0:1500);
  const fl=$('flash'); if(!RM) await fl.animate([{opacity:0},{opacity:1}],{duration:500,fill:'forwards'}).finished;
  S.view='end'; recordResult(); save(); render(); window.scrollTo(0,0);
  if(!RM){ await fl.animate([{opacity:1},{opacity:0}],{duration:700,fill:'forwards'}).finished;
    [1500,1900,2150,2700].forEach(t=>setTimeout(()=>{ sfx('flash'); fl.animate([{opacity:0},{opacity:.85},{opacity:0}],{duration:260}) },t)) }
  busy=false;
}

/* ===== rendering ===== */
function render(o){
  o=o||{}; const app=$('app'), v=S.view;
  document.querySelector('main').classList.remove('lit');
  if(v==='intro') app.innerHTML=viewIntro();
  else if(v==='plan') app.innerHTML=viewPlan(o);
  else if(v==='room') app.innerHTML=viewRoom(S.room);
  else if(v==='door') app.innerHTML=viewDoor();
  else if(v==='timeout') app.innerHTML=viewTimeout();
  else app.innerHTML=viewEnd();
  const g=['room','door'].includes(v); $('guide').hidden=!g; document.body.classList.toggle('has-guide',g);
  $('where').textContent = v==='room' ? `Sala ${ROMAN[S.room]} · ${D.rooms[S.room].name}` : v==='door' ? 'Porta di sicurezza' : v==='plan' ? 'Corridoio delle sale' : v==='end' ? 'Uscita' : 'Ingresso';
  if(g){ gEntry=''; guideIdle() }
  if(o.stay) document.querySelector('main').classList.add('lit');
  if(v==='door') lastMon = S.doorOn ? +($('mon-n')||{dataset:{n:0}}).dataset.n : null;
  if(v==='plan') placeVisitor(S.at||0,false);
  tickClock(); bind();
}
function bind(){
  const on=(id,fn)=>{ const el=$(id); if(el) el.addEventListener('click',fn) };
  document.querySelectorAll('[data-scene]').forEach(mountScene);
  on('go',()=>{ if(busy) return; ac(); const t=$('team'); for(const k in SC) delete SC[k]; paintBars(()=>{ S=fresh(); S.team=(t&&t.value.trim().slice(0,32))||'Visitatori senza nome'; S.started=Date.now(); S.view='plan'; save(); render() }) });
  const go=async idx=>{ if(busy) return; busy=true; ac(); await walkTo(idx); await settle(); const d=doorEl(idx); if(d){ d.classList.add('opening'); sfx('creak') } await wait(RM?0:520); busy=false;
    if(idx===6) zoomInto('[data-door]', ()=>{ S.view='door'; save(); render() });
    else zoomInto(`[data-room="${idx}"]`, ()=>{ S.view='room'; S.room=idx; save(); render() }) };
  document.querySelectorAll('[data-room]').forEach(g=>g.addEventListener('click',()=>go(+g.dataset.room)));
  document.querySelectorAll('[data-door]').forEach(g=>g.addEventListener('click',()=>go(6)));
  const step=async dir=>{ if(busy) return; ac(); busy=true; await walkTo(Math.max(0,Math.min(6,(S.at||0)+dir))); busy=false };
  on('walk-l',()=>step(-1)); on('walk-r',()=>step(1));
  const cor=$('corr'); if(cor) cor.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){ e.preventDefault(); step(1) } else if(e.key==='ArrowLeft'){ e.preventDefault(); step(-1) } else if((e.key==='Enter'||e.key===' ') && e.target===cor){ e.preventDefault(); go(S.at||0) } });
  const back=async()=>{ if(busy) return; const from=S.view==='door'?'[data-door]':`[data-room="${S.room}"]`, fr=S._fresh; if(S.view==='door') S.at=6; else S.at=S.room;
    await zoomOutTo(from, ()=>{ S.view='plan'; save(); render({fresh:fr, back:true}); S._fresh=null });
    const aj=document.querySelector('.door-b.ajar'); if(aj){ await wait(RM?0:250); aj.classList.remove('ajar'); sfx('close') } };
  on('back',back); on('back2',back);
  on('hint',()=>{ if(busy) return; const i=S.room; S.hints[i]=(S.hints[i]||0)+1; S.hintCount++; save(); sfx('page'); penalty(HINT_COST,'+3 min'); S._newHint=true; render({stay:true}); S._newHint=false });
  on('reset',()=>{ confirmReset=true; render({stay:true}) });
  on('reset-no',()=>{ confirmReset=false; render({stay:true}) });
  on('reset-yes',()=>{ confirmReset=false; for(const k in SC) delete SC[k]; paintBars(()=>{ S=fresh(); save(); render() }) });
  on('again',()=>{ for(const k in SC) delete SC[k]; paintBars(()=>{ S=fresh(); save(); render() }) });
  on('noclock',()=>{ S.noClock=true; S.view='plan'; save(); render() });
  const keepTeam=fn=>()=>{ const t=$('team'), val=t?t.value:''; fn(); render({stay:true}); const t2=$('team'); if(t2) t2.value=val };
  on('gb-clear',keepTeam(()=>{ confirmClear=true })); on('gb-no',keepTeam(()=>{ confirmClear=false })); on('gb-yes',keepTeam(()=>{ confirmClear=false; saveBoard([]); rankMsg='' }));
  on('rcode-add',keepTeam(()=>{ const r=readCode(($('rcode')||{}).value||''), l=board();
    if(!r) rankMsg='Codice non valido: controlla di averlo copiato tutto, da GS- fino in fondo.';
    else if(l.some(x=>x.at===r.at && x.team===r.team)) rankMsg=`${r.team} è già in classifica.`;
    else { l.push(r); saveBoard(l); const pos=board().findIndex(x=>x.at===r.at && x.team===r.team)+1; rankMsg=`Aggiunta: ${r.team}, tempo finale ${mmss(r.sec)}, ${pos}° posto.`; sfx('hang') } }));
  on('copy-code',()=>{ const inp=$('mycode'), msg=$('copy-msg'); if(!inp) return;
    const fallback=()=>{ inp.focus(); inp.select(); msg.textContent='Codice selezionato: copialo con Ctrl+C.' };
    try{ navigator.clipboard.writeText(inp.value).then(()=>{ msg.textContent='Copiato. Incollalo in un messaggio per chi organizza.' }, fallback) }catch(e){ fallback() } });
}
applySettings();
if(window.SOLUZIONI) renderSolutions(); else render({stay:true});
</script>
