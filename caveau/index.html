<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Il Caveau Tartaglia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: una colonna stretta come una pagina di registro bancario; in alto la riga di stato (tempo, porte), sotto una stanza alla volta. */
:root{
  --bg:#EDF1EB; --surface:#F8FAF6; --ink:#14241D; --muted:#56675E; --line:#C7D1C7;
  --accent:#1D6A4E; --on-accent:#FFFFFF; --brass:#8F6210; --danger:#A8322A; --tile:#E1E8DF; --blue:#2C5FA8; --steel:#22332C; --steel-2:#34493F; --on-steel:#F1EADB; --on-steel-2:#B8C4BA;
  --plate:radial-gradient(circle at 14px 14px,var(--steel-2) 3px,transparent 3.5px) 0 0/48px 48px,linear-gradient(90deg,var(--steel),var(--steel-2) 50%,var(--steel));
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1613; --surface:#14211C; --ink:#E7EEE7; --muted:#95A89D; --line:#2A3C34;
    --accent:#5FC49A; --on-accent:#0D1613; --brass:#DBA743; --danger:#F27E73; --tile:#1B2B25; --blue:#7FA8E8; --steel:#1F2E28; --steel-2:#33493F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1613; --surface:#14211C; --ink:#E7EEE7; --muted:#95A89D; --line:#2A3C34;
  --accent:#5FC49A; --on-accent:#0D1613; --brass:#DBA743; --danger:#F27E73; --tile:#1B2B25; --blue:#7FA8E8; --steel:#1F2E28; --steel-2:#33493F;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(2.4rem,9vw,3.6rem);letter-spacing:-.01em}
h2{font-size:clamp(1.7rem,6vw,2.3rem)}
h3{font-family:var(--body);font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.muted{color:var(--muted)}

/* riga di stato */
.status{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;
  border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{font-family:var(--display);font-style:italic;font-weight:500;font-size:1.05rem}
.timer{font-family:var(--mono);font-weight:600;font-size:1.25rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer.low{color:var(--danger)}
.timer small{font-family:var(--body);font-weight:500;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.doors{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-basis:100%}
.doors li{flex:1;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:2px;
  font-family:var(--mono);font-size:.78rem;color:var(--muted);background:transparent}
.doors li.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.doors li.now{border-color:var(--brass);color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}

main{display:flex;flex-direction:column;gap:22px}
.story{display:flex;flex-direction:column;gap:12px;max-width:62ch}
.note{font-family:var(--display);font-style:italic;font-size:1.12rem;line-height:1.45;border-left:2px solid var(--brass);padding-left:14px}
.question{font-weight:600;font-size:1.08rem;max-width:62ch}

/* serratura */
.lock{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:12px}
.lock label{font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lock-row{display:flex;flex-wrap:wrap;gap:10px}
.lock input{flex:1 1 180px;min-width:0;font-family:var(--mono);font-size:1.5rem;font-weight:600;letter-spacing:.14em;
  padding:10px 14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px}
.lock input:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:3px}
.btn{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);font-weight:600;padding:11px 20px}
.btn:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:9px 16px;font-weight:500}
.btn-ghost:hover{border-color:var(--muted)}
.fb{min-height:1.6em;font-weight:500}
.fb.bad{color:var(--danger)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.hints{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hint{color:var(--muted);max-width:62ch}
.hint b{color:var(--brass);font-weight:600}

.solved{border:1px solid var(--accent);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.solved .code{font-family:var(--mono);font-weight:600;font-size:1.5rem;letter-spacing:.1em;color:var(--accent)}
.formula{font-family:var(--mono);font-size:.98rem;overflow-x:auto;padding:2px 0}

/* pavimento di Tartaglia */
.tri-scroll{overflow-x:auto}
.tri{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:300px;padding:4px 0}
.tri-row{display:flex;gap:4px}
.tile{width:30px;height:30px;display:grid;place-items:center;background:var(--tile);border-radius:2px;
  font-family:var(--mono);font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.tile.worn{color:transparent;opacity:.6}
.tile.gold{background:var(--brass);color:var(--on-accent);font-weight:600;opacity:1}
:root .tile.gold{color:var(--bg)}

.room,.col{display:flex;flex-direction:column;gap:22px;min-width:0}
@media (min-width:900px){
  body{font-size:17px}
  .wrap{padding-block:32px 64px;gap:36px}
  .room{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:56px;align-items:start}
  .side{position:sticky;top:24px}
  .tile{width:46px;height:46px;font-size:1rem}
  .tri,.tri-row{gap:6px}
  .tri{align-items:flex-start}
  .tri-row{align-self:center}
  .doors li{height:36px;font-size:.9rem}
  .timer{font-size:1.6rem}
  .brand{font-size:1.25rem}
  .dial{width:120px;height:120px}
}
/* illustrazioni delle stanze */
.art{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px}
.art>svg{display:block;width:100%;height:auto}
.a-l{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.a-k{fill:none;stroke:var(--brass);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.a-t{fill:var(--tile);stroke:var(--line);stroke-width:1.5}
.a-frame{stroke:var(--ink);stroke-width:2}
.a-b{fill:var(--brass)} .a-m{fill:var(--muted)} .a-green{fill:var(--accent);stroke:var(--accent)}
.a-red{fill:var(--danger);stroke:var(--danger)} .a-blue{fill:var(--blue);stroke:var(--blue)}
.a-beam{fill:none;stroke-width:2;stroke-dasharray:4 6;opacity:.7}
.a-off{opacity:.3}
.a-tx{fill:var(--ink);font:600 20px var(--mono);text-anchor:middle;dominant-baseline:central}
.a-h{fill:var(--muted);font:600 13px var(--body);letter-spacing:.12em}
.a-let{fill:var(--brass);font:600 52px var(--body);text-anchor:middle}
/* intro / fine */
.dial{width:92px;height:92px;color:var(--brass)}
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:12px 36px}
.stat b{display:block;font-family:var(--mono);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.table-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
td.m{font-family:var(--mono);white-space:nowrap}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding-right:0;color:var(--accent);font-weight:600}
th.n{text-align:right;padding-right:0}
footer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:14px;font-size:.9rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* ===== animazioni ===== */
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes drop{from{opacity:0;transform:translateY(-50px) rotate(-14deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popin{from{opacity:0;transform:translateY(14px)}}
@keyframes tilein{from{opacity:0;transform:scale(.3)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
.enter .col>*,.enter>:not(.room){animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*80ms)}
.enter tbody tr{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.7s + var(--d,0)*90ms)}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;animation:drop .7s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:calc(250ms + var(--i)*45ms)}
.dial{animation:spin 20s linear infinite}
.dial.fast{animation:spin .9s cubic-bezier(.6,0,.2,1) 2}

/* pulsanti */
.btn,.btn-ghost{position:relative;overflow:hidden;transition:transform .18s cubic-bezier(.2,.8,.2,1.4),box-shadow .18s,border-color .18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px var(--accent)}
.btn-ghost:hover{transform:translateY(-2px)}
.btn:active,.btn-ghost:active{transform:scale(.96)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-130%);pointer-events:none}
.btn:hover::after{transform:translateX(130%);transition:transform .7s}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.3;transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* serratura e lucchetto */
.lock-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.padlock{width:30px;height:42px;color:var(--brass);flex:none;transition:color .3s}
.padlock .shackle{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;transform-origin:29px 22px;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.padlock .pl-body{fill:currentColor}
.padlock .pl-dial{transform-origin:20px 34px;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.padlock .pl-dial circle{fill:var(--surface)}
.padlock .pl-dial line{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.lock{transition:border-color .3s,box-shadow .3s}
.lock input{transition:border-color .2s,transform .12s,color .2s}
.lock input.pop{transform:scale(1.03)}
.lock.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.lock.open .padlock{color:var(--accent)}
.lock.open .shackle{transform:translateY(-6px) rotate(32deg)}
.lock.open input{border-color:var(--accent);color:var(--accent)}
.lock.bad .padlock{color:var(--danger);animation:shake .35s}
.lock.bad input{animation:flash .6s}
@keyframes flash{0%,100%{border-color:var(--line)}20%,60%{border-color:var(--danger)}}
.solved.flip{animation:flipin .7s cubic-bezier(.2,.8,.2,1.2) both;transform-origin:top center}
@keyframes flipin{from{opacity:0;transform:perspective(700px) rotateX(-75deg)}}
.solved.flip .code{display:inline-block;animation:codepop .9s cubic-bezier(.2,.8,.2,1.5) .2s both}
@keyframes codepop{from{transform:scale(.4);opacity:0}}
.hint{padding:6px 10px;border-radius:3px}
.hint.new{animation:hintin 2.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes hintin{0%{opacity:0;transform:translateX(30px);background:var(--tile)}20%{opacity:1;transform:none;background:var(--tile)}100%{background:transparent}}

/* barra delle porte e timer */
.doors li{transition:background .3s}
.doors li.now{animation:nowpulse 1.8s ease-in-out infinite}
@keyframes nowpulse{50%{box-shadow:inset 0 0 0 1px var(--brass),0 0 14px 0 var(--brass)}}
.doors li.just{animation:justdone .8s cubic-bezier(.2,.8,.2,1.4)}
@keyframes justdone{40%{transform:scale(1.3) rotate(-5deg)}}
.status-r{display:flex;align-items:center;gap:14px}
.timer{display:inline-block}
.colon{animation:blink 1s steps(1) infinite}
.timer.low #clock{display:inline-block;animation:beat 1s ease-in-out infinite}
@keyframes beat{15%{transform:scale(1.15)}30%{transform:none}45%{transform:scale(1.08)}}
.timer.hit{animation:hit .6s}
@keyframes hit{20%,60%{color:var(--danger);transform:scale(1.12)}}
.sound{font:inherit;font-size:.8rem;background:transparent;border:1px solid var(--line);color:var(--muted);padding:4px 10px}
.sound:hover{border-color:var(--muted);color:var(--ink)}
.float{position:fixed;transform:translate(-50%,0);font:600 1.3rem var(--mono);color:var(--danger);pointer-events:none;z-index:70;animation:floatup 1.2s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,-6px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-56px)}}

/* ===== passaggi tra le stanze: uno diverso per ogni porta ===== */
.tr{position:fixed;inset:0;z-index:50;overflow:hidden;cursor:pointer}
.tr .layers{position:absolute;inset:0}
.tr .layers>*{position:absolute}
.mcard{position:absolute;left:50%;top:50%;width:min(560px,calc(100vw - 32px));padding:26px 30px 20px;background:var(--steel);border:2px solid var(--brass);border-radius:4px;color:var(--on-steel);text-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none}
.tr.card-on .mcard{animation:cardIn .55s cubic-bezier(.2,.9,.3,1.35) both}
.tr.reveal .mcard{animation:cardOut .3s ease-in both}
@keyframes cardIn{from{opacity:0;transform:translate(-50%,-50%) scale(.7) rotate(-3deg)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes cardOut{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-50%) scale(1.12)}}
.m-eye{margin:0;font:600 .8rem var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.m-title{margin:0;font:700 clamp(1.8rem,5vw,2.6rem)/1.1 var(--display);text-wrap:balance}
.m-goal{margin:0;font-size:1rem;color:var(--on-steel-2)}
.m-bar{height:3px;background:var(--brass);transform:scaleX(0);transform-origin:left;margin-top:6px}
.tr.card-on .m-bar{transform:scaleX(1);transition:transform 2.5s linear .2s}
.m-skip{margin:0;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--on-steel-2)}
.mcard .ch{animation:none}
.tr.card-on .mcard .ch{animation:drop .6s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:calc(150ms + var(--i)*35ms)}

/* 1 · ante blindate */
.t-ante .leaf{top:0;bottom:0;width:51%;background:var(--plate)}
.t-ante .leaf.l{left:0;border-right:3px solid var(--brass);transform:translateX(-102%)}
.t-ante .leaf.r{right:0;border-left:3px solid var(--brass);transform:translateX(102%)}
.t-ante.cover .leaf.l{animation:inL .6s cubic-bezier(.7,0,.25,1) both}
.t-ante.cover .leaf.r{animation:inR .6s cubic-bezier(.7,0,.25,1) both}
.t-ante.reveal .leaf.l{animation:outL .65s cubic-bezier(.7,0,.25,1) both}
.t-ante.reveal .leaf.r{animation:outR .65s cubic-bezier(.7,0,.25,1) both}
@keyframes inL{from{transform:translateX(-102%)}to{transform:none}}
@keyframes inR{from{transform:translateX(102%)}to{transform:none}}
@keyframes outL{from{transform:none}to{transform:translateX(-102%)}}
@keyframes outR{from{transform:none}to{transform:translateX(102%)}}
.t-ante .tdial{left:50%;top:50%;width:110px;height:110px;margin:-250px 0 0 -55px;color:var(--brass);opacity:0}
.t-ante.cover .tdial{animation:dialIn 1.5s .35s cubic-bezier(.6,0,.2,1) both}
.t-ante.reveal .tdial{animation:fadeOut .25s both}
@keyframes dialIn{from{opacity:0;transform:scale(.4) rotate(0)}to{opacity:1;transform:scale(1) rotate(720deg)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}

/* 2 · faretto che parte dal clic */
.t-iris .iris{inset:0;background:var(--plate);clip-path:circle(0px at var(--x) var(--y))}
.t-iris .iris.rim{background:var(--brass)}
.t-iris.cover .iris{animation:irisIn .8s cubic-bezier(.6,0,.3,1) both}
.t-iris.cover .iris:not(.rim){animation-delay:.08s}
.t-iris.reveal .iris{animation:irisOut .7s cubic-bezier(.6,0,.3,1) both}
.t-iris.reveal .iris.rim{animation-delay:.08s}
@keyframes irisIn{from{clip-path:circle(0px at var(--x) var(--y))}to{clip-path:circle(150vmax at var(--x) var(--y))}}
@keyframes irisOut{from{clip-path:circle(150vmax at 50% 50%)}to{clip-path:circle(0px at 50% 50%)}}

/* 3 · tastiera che si ribalta */
.t-tasti .grid{inset:0;display:grid}
.t-tasti .grid span{display:grid;place-items:center;background:var(--steel);box-shadow:0 0 0 1px var(--steel);font:600 clamp(1.4rem,4vw,2.4rem) var(--mono);color:var(--steel-2);opacity:0}
.t-tasti .grid span.o{background:var(--steel-2);box-shadow:0 0 0 1px var(--steel-2);color:var(--steel)}
.t-tasti .grid span.lit{background:var(--brass);box-shadow:0 0 0 1px var(--brass);color:var(--steel)}
.t-tasti.cover .grid span{animation:keyIn .4s cubic-bezier(.2,.8,.3,1.3) both;animation-delay:calc(var(--i)*40ms)}
.t-tasti.reveal .grid span{animation:keyOut .35s ease-in both;animation-delay:calc(var(--i)*30ms)}
@keyframes keyIn{from{opacity:0;transform:scale(0) rotate(90deg)}to{opacity:1;transform:none}}
@keyframes keyOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(0) rotate(-90deg)}}

/* 4 · tenda diagonale e lettere che cadono */
.t-wipe .band{top:0;bottom:0;left:-30%;width:160%;transform:translateX(-110%) skewX(-18deg)}
.t-wipe .band.b1{background:var(--brass)}
.t-wipe .band.b2{background:var(--plate)}
.t-wipe.cover .band{animation:wipeIn .7s cubic-bezier(.7,0,.25,1) both}
.t-wipe.cover .band.b2{animation-delay:.1s}
.t-wipe.reveal .band{animation:wipeOut .7s cubic-bezier(.7,0,.25,1) both}
.t-wipe.reveal .band.b1{animation-delay:.1s}
@keyframes wipeIn{from{transform:translateX(-110%) skewX(-18deg)}to{transform:translateX(0) skewX(-18deg)}}
@keyframes wipeOut{from{transform:translateX(0) skewX(-18deg)}to{transform:translateX(110%) skewX(-18deg)}}
.t-wipe .lt{top:0;left:calc(var(--k)*10.5% + 3%);font:700 clamp(4rem,12vw,10rem)/1 var(--display);color:var(--brass);opacity:0}
.t-wipe.card-on .lt{animation:ltFall .9s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--k)*80ms)}
.t-wipe.reveal .lt{animation:ltOut .4s ease-in both}
@keyframes ltFall{from{opacity:0;transform:translateY(-120%) rotate(-40deg)}to{opacity:.3;transform:translateY(var(--ty)) rotate(var(--rot))}}
@keyframes ltOut{from{opacity:.3;transform:translateY(var(--ty)) rotate(var(--rot))}to{opacity:0;transform:translateY(calc(var(--ty) + 40vh)) rotate(var(--rot))}}

/* 5 · cassetti che scorrono */
.t-drawer .dr{left:0;right:0;top:calc(var(--k)*100%/var(--n));height:calc(100%/var(--n) + 1px);background:var(--plate);border-bottom:2px solid var(--steel);transform:translateX(calc(var(--s)*-102%))}
.t-drawer .dr::before{content:attr(data-n);position:absolute;right:6%;top:50%;transform:translateY(-50%);font:600 1.6rem var(--mono);color:var(--brass)}
.t-drawer .dr::after{content:"";position:absolute;left:6%;top:50%;width:90px;height:12px;margin-top:-6px;border-radius:6px;background:var(--brass)}
.t-drawer.cover .dr{animation:drIn .55s cubic-bezier(.3,1.25,.5,1) both;animation-delay:calc(var(--k)*70ms)}
.t-drawer.reveal .dr{animation:drOut .5s cubic-bezier(.6,0,.8,.4) both;animation-delay:calc(var(--k)*60ms)}
@keyframes drIn{from{transform:translateX(calc(var(--s)*-102%))}to{transform:none}}
@keyframes drOut{from{transform:none}to{transform:translateX(calc(var(--s)*102%))}}

/* 6 · triangolo che si apre dalla punta */
.t-tri .tri-ov{inset:0;clip-path:polygon(50% 0,50% 0,50% 0);background:repeating-linear-gradient(60deg,transparent 0 46px,var(--steel-2) 46px 49px),repeating-linear-gradient(-60deg,transparent 0 46px,var(--steel-2) 46px 49px),repeating-linear-gradient(0deg,transparent 0 46px,var(--steel-2) 46px 49px),var(--steel)}
.t-tri .tri-ov.rim{background:var(--brass)}
.t-tri.cover .tri-ov{animation:triIn .85s cubic-bezier(.6,0,.3,1) both}
.t-tri.cover .tri-ov:not(.rim){animation-delay:.09s}
.t-tri.reveal .tri-ov{animation:triOut .75s cubic-bezier(.6,0,.3,1) both}
.t-tri.reveal .tri-ov.rim{animation-delay:.09s}
@keyframes triIn{from{clip-path:polygon(50% 0,50% 0,50% 0)}to{clip-path:polygon(50% -120%,250% 160%,-150% 160%)}}
@keyframes triOut{from{clip-path:polygon(50% -120%,250% 160%,-150% 160%)}to{clip-path:polygon(50% 100%,50% 100%,50% 100%)}}

/* 7 · colonne che scendono come una squadra in fila */
.t-cols .cb{top:0;bottom:0;left:calc(var(--k)*100%/var(--c));width:calc(100%/var(--c) + 1px);background:var(--steel);border-bottom:6px solid var(--brass);transform:translateY(-102%)}
.t-cols .cb.o{background:var(--steel-2)}
.t-cols.cover .cb{animation:cbIn .5s cubic-bezier(.5,0,.3,1.3) both;animation-delay:calc(var(--d)*45ms)}
.t-cols.reveal .cb{animation:cbOut .45s cubic-bezier(.6,0,.8,.4) both;animation-delay:calc(var(--d)*45ms)}
@keyframes cbIn{from{transform:translateY(-102%)}to{transform:none}}
@keyframes cbOut{from{transform:none}to{transform:translateY(102%)}}

/* 8 · volante della porta blindata */
.t-wheel .wbg{inset:0;background:var(--plate);clip-path:circle(0px at 50% 50%)}
.t-wheel .wh{left:50%;top:50%;width:min(86vmin,680px);height:min(86vmin,680px);color:var(--brass);opacity:0;transform:translate(-50%,-50%) scale(.2)}
.t-wheel .wh svg{display:block;width:100%;height:100%}
.t-wheel .wh .sp{transform-origin:100px 100px}
.t-wheel.cover .wbg{animation:wbgIn .7s cubic-bezier(.6,0,.3,1) both}
.t-wheel.cover .wh{animation:whIn 1.1s cubic-bezier(.2,.8,.2,1) both}
.t-wheel.card-on .wh .sp{animation:spin 5s linear infinite}
.t-wheel.reveal .wbg{animation:wbgOut .7s ease-in both}
.t-wheel.reveal .wh{animation:whOut .7s ease-in both}
@keyframes wbgIn{from{clip-path:circle(0px at 50% 50%)}to{clip-path:circle(150vmax at 50% 50%)}}
@keyframes wbgOut{from{clip-path:circle(150vmax at 50% 50%);opacity:1;transform:none}to{clip-path:circle(150vmax at 50% 50%);opacity:0;transform:scale(2.5)}}
@keyframes whIn{from{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-270deg)}to{opacity:.4;transform:translate(-50%,-50%) scale(1) rotate(0)}}
@keyframes whOut{from{opacity:.4;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-50%) scale(5) rotate(160deg)}}

/* 9 · luce del giorno all'uscita */
.t-light .lg{inset:0;background:radial-gradient(circle at 50% 50%,#FFFFFF 0%,#FFF3D1 45%,var(--brass) 120%);clip-path:circle(0px at 50% 50%)}
.t-light .rays{left:50%;top:50%;width:300vmax;height:300vmax;margin:-150vmax 0 0 -150vmax;background:repeating-conic-gradient(transparent 0 9deg,var(--brass) 9deg 13deg);opacity:0}
.t-light.cover .lg{animation:wbgIn .8s cubic-bezier(.2,.7,.3,1) both}
.t-light.card-on .rays{animation:raysIn .6s both,spin 24s linear infinite}
.t-light.reveal .lg{animation:lightOut .9s ease-in both}
.t-light.reveal .rays{animation:fadeOut .4s both}
@keyframes raysIn{from{opacity:0}to{opacity:.22}}
@keyframes lightOut{from{clip-path:circle(150vmax at 50% 50%);opacity:1}to{clip-path:circle(150vmax at 50% 50%);opacity:0}}

/* 10 · saracinesca quando si ricomincia */
.t-shutter .sh{left:0;right:0;top:0;height:100%;background:repeating-linear-gradient(180deg,var(--steel) 0 22px,var(--steel-2) 22px 26px,var(--steel) 26px 30px);border-bottom:12px solid var(--brass);transform:translateY(-105%)}
.t-shutter.cover .sh{animation:shDown .85s ease-in both}
.t-shutter.reveal .sh{animation:shUp .8s cubic-bezier(.6,0,.4,1) both}
@keyframes shDown{0%{transform:translateY(-105%)}72%{transform:none}86%{transform:translateY(-4%)}100%{transform:none}}
@keyframes shUp{from{transform:none}to{transform:translateY(-105%)}}

/* entrate delle stanze, una diversa a seconda della porta */
@keyframes slideL{from{opacity:0;transform:translateX(-50px)}}
@keyframes zoomIn{from{opacity:0;transform:scale(.85)}}
@keyframes flipIn{from{opacity:0;transform:perspective(600px) rotateX(-60deg)}}
.enter[data-ent="1"] .col>*,.enter[data-ent="1"]>:not(.room){animation-name:slideL}
.enter[data-ent="2"] .col>*,.enter[data-ent="2"]>:not(.room){animation-name:zoomIn}
.enter[data-ent="3"] .col>*,.enter[data-ent="3"]>:not(.room){animation-name:flipIn}
.toggles{display:flex;gap:8px}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.alarm{position:fixed;inset:0;pointer-events:none;z-index:55;animation:alarm .8s ease-in-out 4}
@keyframes alarm{50%{box-shadow:inset 0 0 140px 30px var(--danger)}}

/* immagini delle stanze */
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.an-sway{animation:sway 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*-.45s)}
@keyframes swing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.an-swing{animation:swing 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*-1.1s)}
@keyframes flick{0%,100%{opacity:.8}40%{opacity:.2}48%{opacity:.9}56%{opacity:.3}}
.an-flick{animation:flick 1.9s linear infinite;animation-delay:calc(var(--i)*-.6s)}
.an-pop{animation:popin .5s cubic-bezier(.2,.8,.2,1.3) both;animation-delay:calc(.2s + var(--i)*.07s)}
.an-blink{animation:blink 1.1s infinite;animation-delay:calc(var(--i)*.15s)}
@keyframes keyglow{0%,30%,100%{fill:var(--tile)}12%{fill:var(--brass)}}
.an-key rect{animation:keyglow 3s ease-in-out infinite;animation-delay:calc(var(--i)*.35s)}
@keyframes fall{0%{opacity:0;transform:translateY(-130px)}60%{opacity:1;transform:translateY(8px)}80%{transform:translateY(-4px)}100%{transform:none}}
@keyframes wobble{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
.an-fall{animation:fall .9s ease-out both,wobble 3s ease-in-out infinite;animation-delay:calc(var(--i)*.12s),calc(1.2s + var(--i)*.2s)}
@keyframes glint{0%,84%,100%{transform:none}90%{transform:scale(1.6)}}
.an-glint{transform-box:fill-box;transform-origin:center;animation:glint 3.5s ease-in-out infinite;animation-delay:calc(var(--i)*.33s)}
@keyframes bob{50%{transform:translateY(-7px)}}
.an-bob{animation:bob 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*-.2s)}
.an-wheel{animation:spin 9s linear infinite}
.an-wheel-r{animation:spin 40s linear infinite reverse}
@keyframes qflick{50%{opacity:.2}}
.an-q{animation:qflick 1.4s ease-in-out infinite;animation-delay:calc(var(--i)*.2s)}
.tri-row .tile{animation:tilein .35s cubic-bezier(.2,.8,.2,1.3) both;animation-delay:calc(var(--r)*.1s)}
.tri-row .tile.gold{animation:tilein .35s cubic-bezier(.2,.8,.2,1.3) .9s both,goldpulse 1.4s ease-in-out 1.4s infinite}
@keyframes goldpulse{0%,100%{box-shadow:0 0 0 0 var(--brass);transform:none}50%{box-shadow:0 0 0 8px transparent;transform:scale(1.14)}}

.no-anim *,.no-anim *::before,.no-anim *::after{animation:none!important;transition:none!important}
/* ===== stanze interattive ===== */
.scene{display:flex;flex-direction:column;gap:12px;padding:14px}
.sc-tip{font-size:.88rem;color:var(--muted);max-width:62ch}
.sc-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;border-top:1px dashed var(--line);padding-top:10px}
.sc-note{font-size:.92rem;font-weight:500;min-height:1.5em;flex:1 1 220px;min-width:0}
.sc-reset{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:.8rem;padding:4px 10px}
.sc-reset:hover{color:var(--ink);border-color:var(--muted)}
.sc-empty{font-size:.85rem;color:var(--muted)}
.scene button{touch-action:manipulation}
.scene .shake{animation:shake .35s}
/* chiavi */
.sc-hooks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;border-top:4px solid var(--ink);border-radius:2px}
.hook{display:flex;flex-direction:column;align-items:center;min-height:132px}
.hook-ico{width:14px;height:15px;border:3px solid var(--ink);border-top:0;border-radius:0 0 9px 9px;margin-bottom:-4px}
.hook-empty{flex:1}
.hook-n{font:600 .7rem var(--mono);color:var(--muted);margin-top:auto}
.sc-table{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 18px;background:var(--tile);border-radius:3px;padding:10px;min-height:112px}
.sc-key{background:none;border:0;padding:2px 4px;line-height:0;color:inherit;transition:transform .15s}
.sc-key:hover{transform:translateY(-4px) rotate(-5deg)}
.sc-key.hung{transform-origin:50% 0;animation:sway 2.6s ease-in-out infinite}
.ksvg{width:32px;height:88px;display:block}
.ksvg *{fill:none;stroke:var(--brass);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
/* faretti */
.sc-lamps{display:flex;flex-wrap:wrap;gap:8px}
.lamp{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 6px;border:1px solid var(--line);border-radius:99px;font-size:.82rem}
.lamp span:last-child{color:var(--ink)}
.lamp-ico{width:16px;height:16px;border-radius:50%;background:currentColor;opacity:.35;transition:opacity .2s,box-shadow .2s}
.lamp.c0,.portrait.c0{color:var(--danger)} .lamp.c1,.portrait.c1{color:var(--accent)} .lamp.c2,.portrait.c2{color:var(--blue)}
.lamp.on{border-color:currentColor}
.lamp.on .lamp-ico{opacity:1;box-shadow:0 0 10px 2px currentColor}
.sc-portraits{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;padding-top:16px}
.portrait{position:relative;aspect-ratio:3/4;border:2px solid var(--ink);background:var(--tile);border-radius:2px;display:grid;place-items:center;padding:0;color:var(--muted);transition:box-shadow .25s,transform .15s}
.portrait:hover{transform:translateY(-3px)}
.portrait svg{width:52%;fill:var(--muted)}
.pt-n{position:absolute;left:4px;bottom:2px;font:600 .66rem var(--mono);color:var(--muted)}
.portrait.lit{border-color:currentColor;box-shadow:0 0 0 2px currentColor,0 0 22px 2px currentColor}
.portrait.lit svg{fill:currentColor}
.portrait.lit::before{content:"";position:absolute;left:12%;right:12%;top:-16px;height:13px;background:currentColor;opacity:.55;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}
/* tastierino */
.kp{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:center;padding:6px 0}
.kp-display{display:flex;gap:6px;padding:10px;background:var(--steel);border-radius:4px}
.kp-cell{width:42px;height:54px;display:grid;place-items:center;background:var(--steel-2);border-radius:2px;font:600 1.6rem var(--mono);color:var(--brass)}
.kp-display.full .kp-cell{color:var(--on-steel);box-shadow:inset 0 0 0 2px var(--brass);animation:codepop .35s both}
.kp-keys{display:grid;grid-template-columns:repeat(3,52px);gap:8px}
.kp-key{height:50px;border:2px solid var(--ink);background:var(--surface);font:600 1.2rem var(--mono);color:var(--ink);transition:transform .08s,background .15s,color .15s}
.kp-key:active{transform:scale(.9)}
.kp-key:not(.broken):not(.kp-del):hover{background:var(--brass);border-color:var(--brass);color:var(--bg)}
.kp-key.broken{border:2px dashed var(--line);color:var(--line);background:var(--tile)}
.kp-del{border-color:var(--line);color:var(--muted)}
/* lettere */
.sc-letters{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;padding:12px 0 6px}
.lt-tile{aspect-ratio:4/5;border:0;border-radius:3px;background:var(--brass);color:var(--bg);font:700 clamp(1.1rem,4vw,2rem) var(--display);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.lt-tile:hover{transform:translateY(-3px)}
.lt-tile.sel{transform:translateY(-8px) rotate(-5deg);box-shadow:0 0 0 3px var(--accent),0 7px 0 var(--ink)}
/* cassette */
.sc-boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.box{position:relative;aspect-ratio:6/5;border:2px solid var(--ink);background:var(--tile);border-radius:2px;padding:0;transition:transform .15s,background .2s,box-shadow .2s}
.box:hover{transform:translateY(-3px)}
.bx-n{position:absolute;left:7px;top:3px;font:600 .9rem var(--mono);color:var(--ink)}
.bx-hole{position:absolute;right:18%;top:38%;width:14px;height:24px;background:radial-gradient(circle at 50% 7px,var(--brass) 6px,transparent 6.5px),linear-gradient(var(--brass),var(--brass)) 50% 100%/5px 13px no-repeat}
.box.sel{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.box.sel .bx-hole{transform:rotate(90deg)}
.box.just .bx-hole{animation:turnKey .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes turnKey{from{transform:none}to{transform:rotate(90deg)}}
.bx-ord{position:absolute;right:6px;bottom:3px;font:600 .72rem var(--mono);color:var(--accent)}
/* triangolo */
button.tile{border:0;padding:0;cursor:pointer;transition:background .2s,color .2s}
button.tile:hover{box-shadow:inset 0 0 0 2px var(--brass)}
.tile.clean{background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.tile.hl{background:var(--brass);color:var(--bg)}
.tile.par{background:var(--accent);color:var(--on-accent)}
input.tile{border:1px dashed var(--muted);background:var(--bg);color:var(--ink);text-align:center;font:600 .8rem var(--mono);padding:0;min-width:0;opacity:1}
input.tile:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.tile.wrong{animation:shake .35s;border-color:var(--danger);color:var(--danger)}
.tri-row .tile{animation:none}
.tri.first .tile{animation:tilein .35s cubic-bezier(.2,.8,.2,1.3) both;animation-delay:calc(var(--r)*.1s)}
.tri .tile.gold{animation:goldpulse 1.4s ease-in-out infinite}
.tri.first .tile.gold{animation:tilein .35s cubic-bezier(.2,.8,.2,1.3) .9s both,goldpulse 1.4s ease-in-out 1.4s infinite}
@media (min-width:900px){input.tile{font-size:1rem}}
/* squadra */
.tm-slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:8px;border:2px dashed var(--line);border-radius:4px;transition:border-color .2s}
.tm-slots.ok{border-style:solid;border-color:var(--accent)}
.tm-slots.no{border-style:solid;border-color:var(--danger);animation:shake .35s}
.tm-slot{height:68px;display:grid;place-items:center;border-radius:3px;background:var(--tile)}
.tm-pool{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,4fr);gap:14px}
.tm-h{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.ppl{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px}
.pp{height:64px;width:100%;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--accent);transition:transform .15s}
.pp.t{color:var(--brass)}
.pp svg{width:26px;height:34px;fill:currentColor}
.pp small{font:600 .68rem var(--mono);color:var(--muted)}
.pp:hover{transform:translateY(-3px)}
.pp-ghost{height:64px;border:1px dashed var(--line);border-radius:3px}
/* porta blindata */
.sc-vault{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:center}
.vw{width:118px;height:118px;color:var(--brass);flex:none}
.vw-g{transform-origin:100px 100px;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.vd{display:flex;gap:6px}
.vd-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.vd-col small{font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1}
.vd-btn{width:42px;height:28px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.75rem;padding:0}
.vd-btn:hover{border-color:var(--brass);color:var(--brass)}
.vd-btn:active{transform:scale(.92)}
.vd-dig{width:42px;height:54px;display:grid;place-items:center;overflow:hidden;background:var(--steel);color:var(--brass);font:600 1.7rem var(--mono);border-radius:2px}
.vd-dig span{display:block}
.vd-dig.ru span{animation:rollU .22s ease-out}
.vd-dig.rd span{animation:rollD .22s ease-out}
@keyframes rollU{from{transform:translateY(80%);opacity:0}}
@keyframes rollD{from{transform:translateY(-80%);opacity:0}}
.vd-checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.vd-checks li.ok{color:var(--accent);font-weight:600}
.vd-checks li.no{color:var(--muted)}
/* cassaforte */
.sf-slots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;padding:10px;background:var(--steel);border-radius:4px;transition:box-shadow .3s}
.sf-slots.full{box-shadow:0 0 0 3px var(--brass),0 0 24px 0 var(--brass)}
.sf-slot{aspect-ratio:3/4;border:1px dashed var(--steel-2);border-radius:3px;display:grid;place-items:center;min-width:0}
.sf-n{font:600 .75rem var(--mono);color:var(--on-steel-2)}
.sf-table{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:92px;background:var(--tile);border-radius:3px;padding:10px}
.frag{width:100%;max-width:58px;aspect-ratio:3/4;border:0;border-radius:3px;background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px var(--brass),0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;transition:transform .15s}
.sf-table .frag{width:54px}
.frag b{font:700 clamp(1.1rem,3.4vw,1.7rem)/1 var(--display)}
.frag small{font:500 .6rem var(--mono);color:var(--muted)}
button.frag:hover{transform:translateY(-3px)}
.frag-found{display:flex;align-items:center;gap:14px;padding:10px 12px;background:var(--tile);border-radius:3px}
.frag.big{width:54px;flex:none;animation:fragIn .6s cubic-bezier(.2,.9,.3,1.4) .5s both}
@keyframes fragIn{from{opacity:0;transform:scale(.3) rotate(-25deg)}}
.flying{position:fixed;z-index:65;pointer-events:none;margin:0;animation:none}
.doors li{display:flex;align-items:center;justify-content:center;gap:3px}
.doors li small{font-size:.62rem;opacity:.75}
.doors li b{font-family:var(--display);font-size:1.1em}
.doors li.pending b{visibility:hidden}
.doors li svg{width:12px;height:14px}
/* passaggio verso la cassaforte: anelli */
.t-rings .rg{left:50%;top:50%;width:var(--s);height:var(--s);margin-left:calc(var(--s) / -2);margin-top:calc(var(--s) / -2);border-radius:50%;background:var(--steel);transform:scale(0)}
.t-rings .rg.o{background:var(--steel-2);box-shadow:inset 0 0 0 3px var(--brass)}
.t-rings.cover .rg{animation:rgIn .55s cubic-bezier(.3,1.3,.5,1) both;animation-delay:calc(var(--k)*70ms)}
.t-rings.reveal .rg{animation:rgOut .45s cubic-bezier(.6,0,.8,.4) both;animation-delay:calc((7 - var(--k))*55ms)}
@keyframes rgIn{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
@keyframes rgOut{from{transform:none}to{transform:scale(0) rotate(90deg)}}

/* ===== caveau al buio ===== */

.item-ico{width:40px;height:40px;display:grid;place-items:center;flex:none}
.item-ico svg{width:100%;height:100%}
.torch-note{position:relative;padding:12px 16px;border-radius:6px;background:radial-gradient(ellipse at 20% 50%,rgba(255,226,140,.28),transparent 70%),var(--tile);border:1px dashed var(--brass);font-family:var(--display);font-style:italic;font-size:1.08rem;max-width:62ch}
.torch-note span{display:block;font:600 .66rem var(--body);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin-bottom:4px}
.torch-note.new{animation:torchIn 1s ease-out both}
@keyframes torchIn{from{opacity:0;filter:blur(6px);transform:scale(.97)}}
.torch-fx{position:fixed;inset:0;z-index:66;pointer-events:none;background:radial-gradient(circle 200px at 50% 45%,rgba(255,236,170,.15),rgba(0,0,0,.9) 60%);background-size:260% 100%;animation:torchSweep 1.25s ease-in-out both}
@keyframes torchSweep{0%{background-position:0% 50%;opacity:0}15%{opacity:1}80%{background-position:100% 50%;opacity:1}100%{background-position:100% 50%;opacity:0}}
/* fuga finale */
.chase{display:flex;flex-direction:column;gap:16px;max-width:920px}
.ct{position:relative;height:210px;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:linear-gradient(#0B110E 0 68%,#1B2420 68%)}
.ct-lamps{position:absolute;inset:0 0 auto;height:30px;background:repeating-linear-gradient(90deg,transparent 0 110px,rgba(242,193,78,.5) 110px 118px,transparent 118px 220px);animation:floorRun 1.6s linear infinite}
.ct-floor{position:absolute;left:0;right:0;bottom:0;height:32%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 44px,transparent 44px 88px);animation:floorRun .45s linear infinite}
@keyframes floorRun{to{background-position:-88px 0}}
.ct-door{position:absolute;right:2%;bottom:30%;width:76px;height:118px;border:3px solid #C99A3A;border-bottom:0;background:linear-gradient(#3B2A18,#24190D);display:flex;align-items:flex-end;justify-content:center;padding:0 4px 8px;text-align:center;font:600 .55rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#E8C063}
.ct-you{position:absolute;right:calc(2% + 96px);bottom:29%;width:44px;height:70px;animation:runBob .28s ease-in-out infinite alternate}
.ct-gino{position:absolute;left:0;bottom:29%;width:52px;height:76px;animation:runBob .26s ease-in-out infinite alternate}
.ct-you svg,.ct-gino svg{width:100%;height:100%;display:block;overflow:visible}
.ct-cone{position:absolute;left:92%;top:30%;width:260px;height:90px;clip-path:polygon(0 42%,100% 0,100% 100%,0 58%);background:linear-gradient(90deg,rgba(255,230,150,.6),transparent);pointer-events:none}
@keyframes runBob{to{transform:translateY(-6px)}}
.ct-meter{display:flex;align-items:center;gap:12px;font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ct-bar{flex:1;height:14px;border-radius:7px;background:var(--tile);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.ct-bar i{display:block;height:100%;background:var(--accent);transition:background .3s}
.ct-bar i.mid{background:#E8B03A} .ct-bar i.low{background:var(--danger);animation:alBlink .5s infinite}
.ct-q{max-width:640px}
.cq-n{font-size:.74rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:0}
.cq-t{font-size:1.2rem;font-weight:600;margin:0}
.cq-t.qnew{animation:torchIn .5s both}

/* porta 7 · il sacchetto delle monete */
.trays{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tray{border:1px solid var(--line);border-radius:6px;background:var(--tile);padding:12px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);transition:transform .15s}
.tray:hover{transform:translateY(-3px)}
.tray-pile{position:relative;width:52px;height:50px}
.tray-pile .coin{position:absolute;left:6px;width:40px;height:40px}
.tray-pile .coin:nth-child(1){top:10px}.tray-pile .coin:nth-child(2){top:5px}.tray-pile .coin:nth-child(3){top:0}
.tray:hover .tray-pile .coin:nth-child(3){transform:translateY(-6px) rotate(-8deg)}
.tray small{font-size:.72rem;font-weight:600;color:var(--muted);text-align:center;line-height:1.15}
.coin{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:0;padding:0;font:700 .95rem var(--display);color:rgba(0,0,0,.42);transition:transform .2s;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.35)}
.coin.c0{background:radial-gradient(circle at 35% 30%,#FFF2B0,#E0B44E 45%,#9B7020)}
.coin.c1{background:radial-gradient(circle at 35% 30%,#FFFFFF,#C9CDD2 45%,#7D838A)}
.coin.c2{background:radial-gradient(circle at 35% 30%,#F3D2A8,#C08A4A 45%,#7A5022)}
.coin.c3{background:radial-gradient(circle at 35% 30%,#F7B79A,#C8643A 45%,#7E3418)}
.bag6{display:flex;flex-direction:column;align-items:center;gap:6px}
.bag6-l{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bag6-in{display:grid;grid-template-columns:repeat(6,minmax(0,44px));gap:8px;max-width:100%;padding:16px 18px 20px;background:radial-gradient(ellipse at 50% 0%,#8C6A43,#5E4329);border-radius:12px 12px 40px 40px;box-shadow:inset 0 4px 10px rgba(0,0,0,.4)}
.bag6-in .coin,.coin-slot{width:100%;height:auto;aspect-ratio:1}
.bag6-in .coin:hover{transform:translateY(-4px)}
.coin-slot{border-radius:50%;border:2px dashed rgba(255,255,255,.3)}
.bag6-in .coin.drop{animation:coinDrop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes coinDrop{from{transform:translateY(-50px) scale(.8);opacity:0}}
.sc-row{display:flex;flex-wrap:wrap;gap:8px}
.sc-tog{background:transparent;border:1px solid var(--line);color:var(--ink);font-size:.82rem;padding:5px 12px;border-radius:999px}
.sc-tog.on{background:var(--brass);border-color:var(--brass);color:var(--bg)}
.sbar{display:flex;align-items:center;justify-content:center;gap:8px;min-height:36px;animation:qnewIn .35s both}
.sbar .sb-g{display:inline-flex;gap:4px;min-width:4px}
.sbar .st{width:16px;height:16px;border-radius:50%;background:var(--brass);display:block}
.sbar .br{width:4px;height:32px;background:var(--ink);display:block;border-radius:2px}
@keyframes qnewIn{from{opacity:0;transform:translateY(6px)}}

.sc-key.gold .ksvg *{stroke:#E8B830}
.sc-key.gold .ksvg{filter:drop-shadow(0 0 5px rgba(242,193,78,.75))}
.pt-tag{position:absolute;top:3px;left:50%;transform:translateX(-50%);font:600 .5rem var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--brass);white-space:nowrap}
.box .bx-link{position:absolute;right:-14px;top:46%;width:18px;height:7px;border-radius:4px;background:var(--brass);z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.4)}
/* manopola della combinazione */
.dlock{display:flex;flex-direction:column;align-items:center;gap:12px}

.dl-svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45))}
.dl-rot{will-change:transform}
.dl-bezel{fill:#575D63;stroke:#2B2F33;stroke-width:2}
.dl-ring{stroke:#6E747A;stroke-width:1.5}
.tk-M{stroke:#1B1E21;stroke-width:2.8}
.tk-m{stroke:#33383C;stroke-width:1.3}
.tk-n{font:600 23px var(--body);fill:#1B1E21;text-anchor:middle;dominant-baseline:central}
.dl-kbase{fill:#8F959B}
.knurl{fill:#DCE0E3;stroke:#737980;stroke-width:.8}
.dl-cap{stroke:#878D93;stroke-width:1}
.dl-fixlbl{font:700 10.5px var(--body);letter-spacing:.2em;fill:#5B6167;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dl-mark{stroke:#E0B44E;stroke-width:6;stroke-linecap:round}
.dl-panel{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.dl-row{display:flex;align-items:center;gap:12px}
.dl-step{width:44px;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;border-radius:6px}
.dl-step:hover{border-color:var(--brass)}
.dl-now{display:flex;flex-direction:column;align-items:center;line-height:1;min-width:84px}
.dl-now small{font-size:.62rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.dl-now b{font:700 2rem var(--mono);color:var(--ink)}
.dl-now b.pop{animation:dlPop .18s ease-out}
@keyframes dlPop{50%{transform:scale(1.25)}}
.dl-combo{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dl-combo.shake{animation:shake .35s}
.dl-slot{width:34px;height:44px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:4px;font:700 1.45rem var(--mono);color:var(--ink);background:var(--bg)}
.dl-slot.on{border-style:solid;border-color:var(--brass);background:var(--surface);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.dl-slot.new{animation:dlSlot .4s cubic-bezier(.2,.9,.3,1.4)}
@keyframes dlSlot{from{transform:translateY(-16px) scale(.5);opacity:0}}
.dl-acts{display:flex;gap:8px}
.dl-acts button{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:.78rem;padding:4px 10px;border-radius:4px}
.dl-acts button:hover{color:var(--ink);border-color:var(--muted)}
.dl-help{font-size:.78rem;line-height:1.35;color:var(--muted);text-align:center;margin:0;max-width:34ch}
.dl-go{justify-content:center}
.dl-go .btn{min-width:200px}
.ct-q .dlock{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:18px}
.ct-q .dl-face{width:min(180px,56vw)}
.ct-q .dl-panel{width:auto}

<script>
const ROOMS = [{"place":"Atrio","name":"L'atrio delle chiavi","story":"<p>Sul muro ci sono sei ganci in fila. Sul tavolo, sei chiavi tutte diverse: una è <b>d'oro</b>, quella del direttore. Accanto, un biglietto:</p>\n   <p class=\"note\">«La porta si sblocca solo se appendo le chiavi nell'ordine giusto. Una cosa la ricordo: la mia chiave d'oro non sta mai su un gancio alle estremità. Quanti ordini restano? Quel numero è il codice.»</p>","q":"In quanti modi si possono appendere le 6 chiavi ai 6 ganci, se la chiave d'oro non può stare né sul primo né sull'ultimo gancio?","hints":["Usi tutte le chiavi e conta l'ordine: sono permutazioni. Comincia dalla chiave con il vincolo: quella d'oro può andare solo su uno dei 4 ganci centrali.","Sistemata la chiave d'oro, le altre 5 chiavi riempiono i 5 ganci rimasti in 5! modi. Moltiplica: 4·5!."],"word":false,"h":3318716058,"x":"3h7+mt0NWtDkTtpImIl2etHqYlNQJFe+pjfrPm6dzJAF68qN6J1Gp/zQGadYgddYRxo2eAcUlEnyQ/716SXaCH0yYOKswFLUxf8SalBotKTDDXoEtMghCGGX9ZM+KRB+ppAwc4zg7+T3YoIFQwhs/57CqqNzu4v2akFcK4/tuA7ft6LBljQB81l2TYV5yuuHuVAzGm+PzgHz6kwsulVPxSRJz01J2lFyKMKaY2LAc3xxwRwjxolvsmD2J8YR0AnsZp/37dFJ93XjbsvK+sL8Flfm6Rdth7GSRMRXk29/rgiP5JrWc/hIkOoJFsXY8VRt3Be4XL1Vgh1CuFmo/oJCFchoJLk+k3v7OTTJQo3Tx42avU150h0kA2liWUeFinNBokm7ayLArvczMl0qUd5ML3R9lw=="},{"place":"Galleria","name":"La galleria dei direttori","story":"<p>Otto ritratti di vecchi direttori ti fissano dalle pareti; il primo è il <b>fondatore</b> della banca. Sul soffitto ci sono tre faretti: uno rosso, uno verde, uno blu. Ognuno va puntato su un ritratto diverso.</p>\n   <p class=\"note\">«Il rosso sul fondatore? Mai, sembrerebbe arrabbiato. Solo una disposizione dei tre colori accende il sensore. Quante ne dovrebbe provare un ladro, al peggio?»</p>","q":"In quanti modi puoi puntare i 3 faretti colorati su 3 ritratti diversi tra gli 8, se il faretto rosso non può illuminare il fondatore?","hints":["L'ordine dei colori conta e un ritratto non riceve due faretti: sono disposizioni. Com  R T A G L I A</b>.</p>\n   <p class=\"note\">«Rimettile in fila come vuoi, anche senza senso. Conta le parole diverse che puoi leggere: è il codice.»</p>","q":"Quanti anagrammi, anche privi di significato, ha la parola TARTAGLIA?","hints":["Sono permutazioni di 9 lettere, ma alcune lettere sono uguali: scambiare due A tra loro non cambia la parola. Permutazioni con ripetizione.","Conta le lettere uguali: la A compare 3 volte, la T 2 volte. Dividi 9! per 3! e per 2!."],"word":false,"h":1013111380,"x":"cQZUL8A1LHwp8qZIb4TfRjGteR+1poML/tq/JA0AHYTHQ19rgGTSL+7IVkoJVDROCWl6RreDl2DhknzNy72BpOaQKPLUd8xsD3H7OTXpcAb++ktPahcjPWtqqo087oxSm5ECCsizvl8PNOf5ZIyqruE7Tl8hq2lnZE9pJeZp4R2ts8qgBf3vG3nRTHk6NiygLsTLjMnqhDdKnOMN1v2BmdS4TKjT+E+CL5mrYnN30h18FgXJdTEhwITJFxcL2FcXYT8xWWQ5hd9ibQ=="},{"place":"Sala cassette","name":"Le cassette di sicurezza","story":"<p>Dieci cassette di sicurezza, numerate da 1 a 10. Il meccanismo scatta solo se si girano nello stesso istante le chiavi di quattro cassette precise. Le chiavi delle cassette <b>1 e 2</b> sono incastrate tra loro: si girano tutte e due insieme, oppure nessuna delle due.</p>\n   <p class=\"note\">«Quali quattro? Questo è il segreto. Quanti gruppi di quattro esistono, invece, è il codice.»</p>","q":"In quanti modi si possono scegliere 4 cassette tra le 10, se le cassette 1 e 2 vanno scelte tutte e due insieme oppure nessuna delle due?","hints":["L'ordine non conta: combinazioni. Dividi in due casi: o scegli le cassette 1 e 2 insieme, o non scegli nessuna delle due.","Con 1 e 2 dentro mancano 2 cassette, da scegliere tra le altre 8: C(8,2). Senza 1 e 2 ne scegli 4 tra le 8: C(8,4). Somma i due casi."],"word":false,"h":4018992367,"x":"xa7A3ttJdJcQmcgGcTGNbVFNcbyHT+zOkjq+zvfnMunqa/sfPeXDAsjl2kCWznBVOuuVVEKK84sqAk7/ftZmDyEFI5kdptlXGLfgUp2J4tv5oKFJzxkY7MscDUaVtQidx+UleIXbWkW3uUozNtoeXZU7NP+EkQh5X/cJoRB4LLW1tOT07GMsv79j41T61lkS/5sA3aTTyRXcFpeM/h2J1K9EeKT/vhGNdJVCi7kGgzqCjq2ZIPBE2ifdtDYz9THk4qY8iGnvycZG2uqJIk/FiCQ42QvHVR1KTSzXtL66geaiAgI1XP const fx = (()=>{
  const c=document.createElement('canvas'); c.className='fx'; c.setAttribute('aria-hidden','true'); document.body.appendChild(c);
  const ctx=c.getContext('2d'), R=Math.random; let parts=[], raf=0;
  function size(){ const d=window.devicePixelRatio||1; c.width=innerWidth*d; c.height=innerHeight*d; ctx.setTransform(d,0,0,d,0,0) }
  addEventListener('resize', size); size();
  function colors(){ const cs=getComputedStyle(document.documentElement); return ['--brass','--accent','--blue','--danger','--ink'].map(v=>cs.getPropertyValue(v).trim()) }
  function star(s){ ctx.beginPath(); for(let i=0;i<10;i++){ const r=i%2?s*.22:s*.55, a=i*Math.PI/5-Math.PI/2; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r) } ctx.closePath() }
  function loop(){ ctx.clearRect(0,0,innerWidth,innerHeight); parts=parts.filter(p=>p.life>0);
    for(const p of parts){ p.vy+=p.g; p.vx*=p.f; p.vy*=p.f; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--;
      ctx.save(); ctx.globalAlpha=Math.min(1,p.life/30); ctx.translate(p.x,p.y); ctx.fillStyle=p.c; ctx.strokeStyle=p.c;
      if(p.k==='rect'){ ctx.rotate(p.r); ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2) }
      else if(p.k==='dot'){ ctx.beginPath(); ctx.arc(0,0,p.s/2,0,7); ctx.fill() }
      else if(p.k==='coin'){ ctx.scale(Math.max(.12,Math.abs(Math.cos(p.r))),1); ctx.beginPath(); ctx.arc(0,0,p.s/2,0,7); ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle=p.c2; ctx.stroke() }
      else if(p.k==='star'){ ctx.rotate(p.r); star(p.s); ctx.fill() }
      else if(p.k==='streak'){ ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-p.vx*3,-p.vy*3); ctx.stroke() }
      ctx.restore() }
    raf = parts.length ? requestAnimationFrame(loop) : 0 }
  function add(p){ parts.push(Object.assign({vx:0,vy:0,g:.25,f:.99,r:R()*6,vr:(R()-.5)*.4,s:8,life:100,k:'rect'},p)) }
  function go(){ if(!raf) loop() }
  function confetti(x,y){ const cl=colors(); for(let i=0;i<120;i++){ const a=R()*Math.PI*2, s=2+R()*8; add({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,s:5+R()*7,c:cl[i%cl.length],life:70+R()*50,k:R()<.3?'dot':'rect'}) } }
  function coins(x,y){ const cl=colors(); for(let i=0;i<60;i++) add({x,y,vx:(R()-.5)*9,vy:-(8+R()*8),g:.38,s:12+R()*8,c:cl[0],c2:cl[4],vr:.15+R()*.2,life:90+R()*40,k:'coin'}); sfx('coins') }
  function stars(x,y){ const cl=colors(); for(let i=0;i<70;i++){ const a=R()*Math.PI*2, s=3+R()*8; add({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.1,f:.97,s:10+R()*12,c:cl[i%3],vr:(R()-.5)*.3,life:80+R()*40,k:'star'}) } }
  function fireworks(x,y){ const cl=colors(); [0,1,2].forEach(j=>setTimeout(()=>{ const cx=x+(R()-.5)*280, cy=y-60-R()*160, col=cl[j%4];
    for(let i=0;i<46;i++){ const a=i/46*Math.PI*2, s=5+R()*2.5; add({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.07,f:.96,c:col,life:55+R()*25,k:'streak'}) }
    sfx('pop'); go() }, j*230)) }
  const MODES=[confetti,coins,stars,fireworks];
  function win(i,x,y){ if(RM) return; MODES[i%MODES.length](x,y); go() }
  function rain(n){ if(RM) return; const cl=colors(); for(let i=0;i<n;i++) add({x:R()*innerWidth,y:-20-R()*innerHeight*.9,vx:(R()-.5)*2,vy:2+R()*3,g:.04,s:6+R()*8,c:cl[i%cl.length],vr:(R()-.5)*.3,life:260+R()*140,k:i%7?'rect':'star'}); go() }
  return {win, rain};
})();

  return `<svg class="handle-s" viewBox="0 0 120 120" aria-hidden="true"><g class="hd-g">${sp}<circle cx="60" cy="60" r="17"/></g></svg>` }
const SC = {};
function st(i){ return SC[i] || (SC[i] = SCENES[i].init()) }
function scene(i){ return `<figure class="art scene sc-${i}" data-scene="${i}">${SCENES[i].view(st(i),i)}</figure>` }
function rerender(fig, i, mutate){
  const before=new Map(), vals=new Map();
  fig.querySelectorAll('[data-id]').forEach(el=>before.set(el.dataset.id, el.getBoundingClientRect()));
  fig.querySelectorAll('input[data-in]').forEach(el=>vals.set(el.dataset.in, el.value));
  const ae=document.activeElement, focusId=ae && fig.contains(ae) ? ae.dataset.id : null;
  const r=mutate();
  fig.innerHTML=SCENES[i].view(st(i),i);
  fig.querySelectorAll('input[data-in]').forEach(el=>{ if(vals.has(el.dataset.in)) el.value=vals.get(el.dataset.in) });
  if(focusId){ const f=fig.querySelector(`[data-id="${focusId}"]`); if(f) f.focus({preventScroll:true}) }
  SCENES[i].after && SCENES[i].after(fig, st(i));
  if(!RM) fig.querySelectorAll('[data-id]').forEach(el=>{ const b=before.get(el.dataset.id); if(!b) return;
    const a=el.getBoundingClientRect(), dx=b.left-a.left, dy=b.top-a.top;
    if(Math.abs(dx)+Math.abs(dy)>1) el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:450,easing:'cubic-bezier(.2,.8,.2,1.15)'}) });
  return r;
}
function mountScenes(root){
  root.querySelectorAll('[data-scene]').forEach(fig=>{
    const ds=fig.dataset.scene, i=isNaN(+ds)?ds:+ds;
    SCENES[i].after && SCENES[i].after(fig, st(i));
    fig.addEventListener('click', e=>{
      const t=e.target.closest('[data-a]'); if(!t || !fig.contains(t)) return;
      const tr=t.getBoundingClientRect(); const r=rerender(fig, i, ()=>SCENES[i].act(st(i), t.dataset.a, t.dataset.v)) || {};
      if(r.sound) sfx(r.sound);
      if(r.bad) restartAnim(fig.querySelector(`[data-id="${r.bad}"]`), 'shake');
      if(r.submit){ const lf=document.getElementById('lock'); if(lf && lf.requestSubmit) lf.requestSubmit() }
      if(r.secret) findSecret(r.secret, tr);
    });
    fig.addEventListener('input', e=>{
      const el=e.target.closest('input[data-in]'); if(!el || !SCENES[i].input) return;
      el.value=el.value.replace(/\D/g,''); el.classList.remove('wrong');
      const s=st(i), id=el.dataset.in;
      if(SCENES[i].input(s, id, el.value)==='ok'){ s.done.delete(id); rerender(fig, i, ()=>{ SCENES[i].input(s, id, el.value) }); sfx('ding');
        const nx=fig.querySelector('input[data-in]'); if(nx) nx.focus({preventScroll:true}) }
      else if(el.classList.contains('tin') && SCENES[i].input(s, id, el.value)==='bad'){ restartAnim(el,'wrong'); sfx('buzz') }
    });
  });
}

SCENES.secret = {
  init:()=>({items:[...'GATIARLTA'].map((ch,id)=>({ch,id})), sel:null, ok:new Set(), note:''}),
  view:s=>{ const w=s.items.map(x=>x.ch).join(''), A=[...w].flatMap((c,i)=>c==='A'?[i]:[]), T=[...w].flatMap((c,i)=>c==='T'?[i]:[]), aOk=A[2]-A[0]===2, tOk=T[1]-T[0]>1;
    const chk=(ok,txt)=>`<li class="${ok?'ok':'no'}"><span aria-hidden="true">${ok?'✓':'✗'}</span> ${txt}</li>`;
    return `<p class="sc-tip">Prova tu: clicca due lettere per scambiarle e cerca parole che rispettino entrambe le regole del forziere.</p>
    <div class="sc-letters">${s.items.map((it,p)=>`<button type="button" class="lt-tile${s.sel===p?' sel':''}" data-a="l" data-v="${p}" data-id="l${it.id}" aria-pressed="${s.sel===p}" aria-label="Lettera ${it.ch}, posizione ${p+1}">${it.ch}</button>`).join('')}</div>
    <ul class="vd-checks">${chk(aOk,'Le tre A sono tutte vicine')}${chk(tOk,'Le due T non sono vicine')}</ul>
    ${foot(s.note||'Parole valide trovate: '+s.ok.size,'Rimescola')}` },
  act:(s,a,v)=>{
    const rules=()=>{ const w=s.items.map(x=>x.ch).join(''), A=[...w].flatMap((c,i)=>c==='A'?[i]:[]), T=[...w].flatMap((c,i)=>c==='T'?[i]:[]); return [w, A[2]-A[0]===2 && T[1]-T[0]>1] };
    if(a==='reset'){ for(let j=s.items.length-1;j>0;j--){ const r=Math.floor(Math.random()*(j+1)); [s.items[j],s.items[r]]=[s.items[r],s.items[j]] } s.sel=null; s.note=''; return {sound:'swap'} }
    const p=+v;
    if(s.sel==null){ s.sel=p; s.note='Ora clicca la lettera con cui scambiarla.'; return {sound:'click2'} }
    if(s.sel===p){ s.sel=null; s.note=''; return {sound:'click2'} }
    const x=s.items[s.sel], y=s.items[p]; s.items[s.sel]=y; s.items[p]=x; s.sel=null;
    const [w,ok]=rules();
    if(!ok){ s.note=''; return {sound:'swap'} }
    const isNew=!s.ok.has(w); s.ok.add(w);
    s.note = isNew ? `${w} rispetta entrambe le regole! Parole valide: ${s.ok.size}.` : `${w} l'avevi già trovata. Valide: ${s.ok.size}.`;
    return {sound:isNew?'ding':'swap'} }
};
function revealSecret(a){

    return JSON.parse(new TextDecoder().decode(out)) }catch(e){ return {topic:'',formula:'',expl:''} }
}

    document.body.append(back, wrap);

    const close=v=>{ dlgOpen=false; S.penalty-=Math.round((Date.now()-t0)/1000); save(); back.remove(); wrap.classList.add('out'); setTimeout(()=>wrap.remove(),250); document.removeEventListener('keydown',kd,true); tick(); res(v) };
    const advance=()=>{ if(!finished){ skip&&skip(); return } if(i<lines.length-1){ i++; show() } else if(!(choices&&choices.length)) close() };

function mountDial(root, input, key, opts){
  opts=opts||{}; if(!root) return null;
  const dial=root.querySelector('.dl-dial'), rot=root.querySelector('.dl-rot'), vEl=root.querySelector('.dl-v'), combo=root.querySelector('.dl-combo'), face=root.querySelector('.dl-face');
  const max=opts.max||6, minSlots=opts.minSlots||4;

  let digits=String(input.value||DLV[key]||'').replace(/\D/g,'').split('').map(Number).slice(0,max);
  const cur=()=>(((Math.round(-ang/36))%10)+10)%10;
  const paint=ms=>{ rot.style.transition=ms?`transform ${ms}ms cubic-bezier(.25,1.15,.5,1)`:'none'; rot.style.transform=`rotate(${ang}deg)`;
    const d=cur(); vEl.textContent=d; dial.setAttribute('aria-valuenow',d);
    if(d!==last){ last=d; const t=performance.now(); if(t-lastTick>30){ sfx('tick'); lastTick=t } restartAnim(vEl,'pop') } };

    input.value=digits.join(''); DLV[key]=input.value; if(!silent&&opts.onChange) opts.onChange(input.value) };
  const step=n=>{ if(locked) return; ang-=n*36; paint(320) };
  const fix=()=>{ if(locked) return; if(digits.length>=max){ restartAnim(combo,'shake'); sfx('buzz'); return } digits.push(cur()); sfx('clink'); restartAnim(face,'clunk'); show(true) };
  const undo=()=>{ if(locked||!digits.length) return; digits.pop(); sfx('click2'); show() };
  const reset=spin=>{ digits=[]; show(false,true); if(spin && !RM){ ang=Math.round(ang/360)*360-720; paint(1100) } else { ang=0; paint(0) } };
  const xy=e=>{ const r=dial.getBoundingClientRect(); return {dx:e.clientX-(r.left+r.width/2), dy:e.clientY-(r.top+r.height/2), R:r.width/2} };
  const deg=p=>Math.atan2(p.dy,p.dx)*180/Math.PI;
  dial.addEventListener('pointerdown',e=>{ if(locked || e.button>0) return; const p=xy(e); try{dial.setPointerCapture(e.pointerId)}catch(_){} drag={a:deg(p), x:e.clientX, y:e.clientY, moved:false}; rot.style.transition='none'; e.preventDefault(); dial.focus({preventScroll:true}) });
  dial.addEventListener('pointermove',e=>{ if(!drag) return; const p=xy(e), a=deg(p); let d=a-drag.a; if(d>180) d-=360; if(d<-180) d+=360; drag.a=a;
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5) drag.moved=true; if(drag.moved){ ang+=d; paint(0) } });
  const end=e=>{ if(!drag) return; const moved=drag.moved; drag=null; const p=xy(e), dist=Math.hypot(p.dx,p.dy)/p.R;
    if(!moved){ if(dist<.42){ fix(); return } if(dist<=1.05){ const th=deg(p)+90, d=((Math.round((th-ang)/36)%10)+10)%10; let delta=(((-d*36-ang)%360)+540)%360-180; ang+=delta } }
    ang=Math.round(ang/36)*36; paint(380) };
  dial.addEventListener('pointerup',end); dial.addEventListener('pointercancel',end);
  dial.addEventListener('wheel',e=>{ e.preventDefault(); step(e.deltaY>0?1:-1) },{passive:false});
  dial.addEventListener('keydown',e=>{ const k=e.key;
    if(k==='ArrowRight'||k==='ArrowUp'){ step(1); e.preventDefault() } else if(k==='ArrowLeft'||k==='ArrowDown'){ step(-1); e.preventDefault() }
    else if(k==='Enter'||k===' '){ fix(); e.preventDefault() } else if(k==='Backspace'||k==='Delete'){ undo(); e.preventDefault() } });
  root.querySelectorAll('.dl-step').forEach(b=>b.addEventListener('click',()=>step(+b.dataset.d)));
  root.querySelector('.dl-fix').addEventListener('click',fix);
  root.querySelector('.dl-undo').addEventListener('click',undo);
  root.querySelector('.dl-clear').addEventListener('click',()=>{ if(!locked){ sfx('click2'); reset(true) } });
  paint(0); show();
  const api={ reset, lock:()=>{ locked=true; root.classList.add('locked') }, set:str=>{ digits=String(str).replace(/\D/g,'').split('').map(Number).slice(0,max); show() }, get value(){ return input.value } };
  if(input.form) input.form._dl=api;
  return api;
}

function flyFrag(room){
  const src=document.querySelector('.frag-found .frag'), li=$('doors').children[room];
  if(!src || !li) return;
  li.classList.add('pending');
  if(RM){ li.classList.remove('pending'); return }
  setTimeout(()=>{
    const a=src.getBoundingClientRect(), b=li.getBoundingClientRect();

    const dx=b.left+b.width/2-(a.left+a.width/2), dy=b.top+b.height/2-(a.top+a.height/2);
    sfx('fly');
    const an=c.animate([{transform:'none'},{transform:`translate(${dx*.45}px,${dy*.45-90}px) scale(.85) rotate(200deg)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.3) rotate(360deg)`,opacity:.9}],{duration:950,easing:'cubic-bezier(.5,0,.3,1)'});

function scramble(el, word, dur){
  if(!el) return; if(RM){ el.textContent=word; return }
  const A='ABCDEFGHILMNOPQRSTUVZ', t0=performance.now();
  (function st(t){ const p=Math.min(1,(t-t0)/dur), n=Math.floor(p*word.length);
    el.textContent = word.slice(0,n) + [...word.slice(n)].map(()=>A[Math.floor(Math.random()*A.length)]).join('');
    if(p<1) requestAnimationFrame(st); else el.textContent=word })(t0);
}

        S.errors++;S.penalty+=ERR_COST;save();tick();
        const sfd=document.querySelector('.safe'); if(sfd) restartAnim(sfd,'denied');
        if(!raiseAlarm()) dirSay('err');
        sfx('bad'); floatText('−0:30',$('timer')); restartAnim($('timer'),'hit'); restartAnim(form,'bad');
        fb.className='fb bad';fb.textContent=form._dl?'Combinazione errata: la manopola torna a zero. Hai perso 30 secondi.':'Codice errato: la serratura non si muove. Hai perso 30 secondi.';
        form.classList.remove('shake');void form.offsetWidth;form.classList.add('shake');
        if(form._dl) form._dl.reset(true); else input.select();
      }
    });
  }
}
render();
</script>

</body>
</html>
