# Solo l'IPA per iPhone, senza APK né prove: circa 4 minuti invece di un quarto d'ora.
# Si lancia a mano: Actions → "Solo IPA" → Run workflow, scegliendo il branch ccr-553def63-wjflww.
# L'IPA non firmata si scarica in fondo alla pagina dell'esecuzione, sotto Artifacts.
# Il workflow completo, che parte da solo a ogni push, resta build-ipa.yml.
name: Solo IPA

on:
  workflow_dispatch:

concurrency:
  group: solo-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: MareaProfonda

jobs:
  ipa:
    name: IPA non firmata
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Questo file sta anche sul branch predefinito, che contiene un altro progetto: lì serve solo
      # a far comparire il pulsante "Run workflow". Il gioco va scelto nel menu del branch.
      - name: Branch del gioco
        run: |
          if [ ! -f project.yml ] || [ ! -d MareaProfonda ]; then
            echo "::error::Su questo branch non c'è Marea Profonda: in Run workflow scegli il branch ccr-553def63-wjflww."
            exit 1
          fi

      - name: Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
          xcodebuild -version

      # Il progetto Xcode non è nel repository: lo genera XcodeGen da project.yml.
      - name: XcodeGen
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Archivio senza firma
        run: |
          set +e
          xcodebuild archive \
            -project MareaProfonda.xcodeproj -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MareaProfonda.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_SUPPRESS_WARNINGS=YES -quiet > archive.log 2>&1
          status=$?
          # In caso di errore mostra solo le righe utili, non l'intero comando del compilatore.
          grep -E "error:|\*\* ARCHIVE" archive.log | cut -c 1-400 | sort -u | head -n 80
          exit $status

      # Un'IPA è uno zip con l'app dentro la cartella Payload. Non è firmata:
      # la firma la mette SideStore (o AltStore) al momento dell'installazione.
      - name: Crea MareaProfonda.ipa
        run: |
          APP="$RUNNER_TEMP/MareaProfonda.xcarchive/Products/Applications/MareaProfonda.app"
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry MareaProfonda.ipa Payload
          ls -lh MareaProfonda.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MareaProfonda-ipa
          path: MareaProfonda.ipa
          if-no-files-found: error
