name: Server - test (Backup iPhone)

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Test
        run: python -m pytest -q
      - name: Il pacchetto si installa (come fa install.sh)
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r requirements.txt
          /tmp/venv/bin/pip install -q --no-deps .
          cd /tmp && /tmp/venv/bin/python -c "import iphone_backup.web, importlib.resources as r; assert (r.files('iphone_backup') / 'templates' / 'dashboard.html').is_file()"
      - name: Shellcheck install.sh
        run: shellcheck install.sh
