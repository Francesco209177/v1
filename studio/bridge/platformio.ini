; Polpo Bridge con PlatformIO (in alternativa ad Arduino IDE: apri polpo_bridge/polpo_bridge.ino).
;   pio run -e uno -t upload        Arduino Uno
;   pio run -e esp32dev -t upload   ESP32 DevKit
[platformio]
src_dir = polpo_bridge

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    paulstoffregen/OneWire@2.3.8

[env:uno]
platform = atmelavr
board = uno

[env:nano]
platform = atmelavr
board = nanoatmega328

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev

[env:esp32s3]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
