[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polpo-studio"
version = "0.1.0"
description = "Programma per PC che comanda il Polpo (M5Stack Cardputer) e i lettori esterni: radio 433 MHz, NFC, RFID 125 kHz, infrarossi, GPIO, Bluetooth, USB, iButton."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Progetto Polpo" }]
dependencies = [
    "PySide6-Essentials==6.12.0",
    "pyserial==3.5",
    "bleak==3.1.0",
    "hidapi==0.15.0",
    "pyusb==1.3.1",
    "libusb-package==1.0.30.1",
    "cryptography==50.0.2",
    "keyring>=25",
    "esptool==5.6.0",
]

[project.optional-dependencies]
# Lettori NFC da PC (PC/SC, es. ACR122U). Su Linux servono pcscd e libpcsclite.
pcsc = ["pyscard==2.3.2"]
dev = ["pytest==9.2.0", "pytest-qt==4.5.0"]

[project.gui-scripts]
polpo-studio = "polpo_studio.app.main:main"

[tool.setuptools.packages.find]
include = ["polpo_studio*"]

[tool.setuptools.package-data]
polpo_studio = ["resources/**/*", "resources/**/.gitkeep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
